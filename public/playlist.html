<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlists - Jay SoundCloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f0f0f; color: #ffffff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sc-orange { color: #ff5500; }
        .sc-bg-orange { background-color: #ff5500; }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-5xl mx-auto p-6 md:p-10">
        <header class="flex justify-between items-center mb-12">
            <a href="index.html" class="flex items-center gap-3">
                <i class="fab fa-soundcloud text-4xl sc-orange"></i>
                <span class="text-xl font-black tracking-tighter">JAY MUSIC</span>
            </a>
            <nav class="flex gap-6 text-xs font-bold uppercase tracking-widest text-gray-500">
                <a href="index.html" class="hover:text-white transition-colors">Home</a>
                <a href="search.html" class="hover:text-white transition-colors">Search</a>
                <a href="library.html" class="hover:text-white transition-colors">Library</a>
                <a href="playlist.html" class="text-white">Playlists</a>
            </nav>
        </header>

        <div class="flex justify-between items-center mb-12">
            <h2 class="text-5xl font-black tracking-tighter uppercase">Your <span class="sc-orange">Playlists</span></h2>
            <button onclick="createNewPlaylist()" class="bg-white text-black font-black px-8 py-3 rounded-full text-xs hover:scale-105 transition-transform">CREATE NEW</button>
        </div>
        
        <div id="playlistContent" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="text-gray-500 font-bold uppercase tracking-widest text-xs py-20 text-center col-span-full">Loading your playlists...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        const firebaseConfig = { /* PASTE CONFIG HERE */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const API_BASE_URL = window.location.origin;
        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) window.location.href = 'login.html';
            else {
                currentUser = user;
                loadPlaylists();
            }
        });

        async function loadPlaylists() {
            const idToken = await currentUser.getIdToken();
            const response = await fetch(`${API_BASE_URL}/api/user/playlists`, {
                headers: { 'Authorization': `Bearer ${idToken}` }
            });
            const data = await response.json();
            const container = document.getElementById('playlistContent');
            if (data.length > 0) {
                container.innerHTML = data.map(pl => `
                    <div class="glass p-6 rounded-3xl aspect-square flex flex-col justify-center items-center gap-4 hover:bg-white/5 transition-all cursor-pointer group">
                        <div class="w-20 h-20 bg-gray-800 rounded-2xl flex items-center justify-center group-hover:bg-orange-500 transition-colors">
                            <i class="fas fa-list-ul text-3xl text-gray-600 group-hover:text-white"></i>
                        </div>
                        <h4 class="font-black text-center tracking-tight">${pl.name}</h4>
                        <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">${pl.songs?.length || 0} Songs</p>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<p class="text-gray-700 font-bold uppercase tracking-widest text-xs py-20 text-center col-span-full">You haven\'t created any playlists yet.</p>';
            }
        }

        window.createNewPlaylist = async () => {
            const name = prompt("Enter playlist name:");
            if (!name) return;
            const idToken = await currentUser.getIdToken();
            await fetch(`${API_BASE_URL}/api/user/playlists/create`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
                body: JSON.stringify({ name })
            });
            loadPlaylists();
        };
    </script>
</body>
</html>
