<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Playlists - Jay SoundCloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f0f0f; color: #ffffff; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sc-orange { color: #ff5500; }
        .sc-bg-orange { background-color: #ff5500; }
        .playlist-card:hover { background: rgba(255, 255, 255, 0.07); transform: translateY(-2px); }
        
        /* Mobile nav toggle */
        .mobile-nav { display: none; }
        @media (max-width: 768px) {
            .desktop-nav { display: none !important; }
            .mobile-nav { display: flex; }
        }
        
        /* Modal overlay */
        .modal-overlay { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); }
        
        /* Custom input styling */
        .modal-input:focus { border-color: #ff5500; }
        
        /* Smooth transitions */
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Mobile-friendly touch targets */
        .touch-target { min-height: 44px; min-width: 44px; }
    </style>
</head>
<body class="min-h-screen pb-24 md:pb-32">
    <!-- Mobile Header -->
    <div class="mobile-nav fixed top-0 left-0 right-0 z-40 glass border-b border-white/5 px-4 py-3">
        <div class="flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <i class="fab fa-soundcloud text-2xl sc-orange"></i>
                <span class="text-sm font-black tracking-tighter">JAY MUSIC</span>
            </a>
            <button onclick="toggleMobileMenu()" class="touch-target flex items-center justify-center w-10 h-10 rounded-lg bg-white/5">
                <i class="fas fa-bars text-lg"></i>
            </button>
        </div>
        <!-- Mobile Menu Dropdown -->
        <div id="mobileMenu" class="hidden absolute top-full left-0 right-0 glass border-b border-white/5 mt-1 rounded-b-2xl overflow-hidden">
            <div class="flex flex-col p-4 gap-3">
                <a href="index.html" class="text-sm font-bold py-2 px-4 rounded-lg hover:bg-white/5 transition-colors">Home</a>
                <a href="search.html" class="text-sm font-bold py-2 px-4 rounded-lg hover:bg-white/5 transition-colors">Search</a>
                <a href="library.html" class="text-sm font-bold py-2 px-4 rounded-lg hover:bg-white/5 transition-colors">Library</a>
                <a href="playlist.html" class="text-sm font-bold py-2 px-4 rounded-lg bg-white/10 text-white">Playlists</a>
            </div>
        </div>
    </div>
    
    <!-- Desktop Content -->
    <div class="max-w-5xl mx-auto p-6 md:p-10 pt-20 md:pt-6">
        <header class="desktop-nav flex justify-between items-center mb-12">
            <a href="index.html" class="flex items-center gap-3">
                <i class="fab fa-soundcloud text-4xl sc-orange"></i>
                <span class="text-xl font-black tracking-tighter">JAY MUSIC</span>
            </a>
            <nav class="flex gap-6 text-xs font-bold uppercase tracking-widest text-gray-500">
                <a href="index.html" class="hover:text-white transition-colors">Home</a>
                <a href="search.html" class="hover:text-white transition-colors">Search</a>
                <a href="library.html" class="hover:text-white transition-colors">Library</a>
                <a href="playlist.html" class="text-white">Playlists</a>
            </nav>
        </header>

        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 md:mb-12">
            <h2 class="text-3xl sm:text-5xl font-black tracking-tighter uppercase">Your <span class="sc-orange">Playlists</span></h2>
            <button onclick="showCreateModal()" class="touch-target bg-white text-black font-black px-6 sm:px-8 py-3 rounded-full text-xs hover:scale-105 transition-transform shadow-lg">
                <i class="fas fa-plus mr-2"></i>CREATE NEW
            </button>
        </div>
        
        <!-- Error/Status Message -->
        <div id="statusMessage" class="hidden mb-6 p-4 rounded-xl text-sm font-bold"></div>
        
        <div id="playlistContent" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
            <p class="text-gray-500 font-bold uppercase tracking-widest text-xs py-20 text-center col-span-full">Loading your playlists...</p>
        </div>

        <!-- Songs in Playlist View -->
        <div id="songsView" class="hidden mt-8 md:mt-16">
            <div class="flex items-center gap-4 md:gap-6 mb-6 md:mb-8">
                <button onclick="hideSongsView()" class="touch-target flex items-center justify-center text-gray-500 hover:text-white transition-colors">
                    <i class="fas fa-chevron-left text-xl md:text-2xl"></i>
                </button>
                <h3 id="currentPlaylistName" class="text-xl sm:text-3xl font-black tracking-tight truncate"></h3>
                <button onclick="deleteCurrentPlaylist()" class="touch-target ml-auto text-red-500 hover:text-red-400 transition-colors text-sm">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
            <div id="songsList" class="grid grid-cols-1 gap-3">
                <!-- Songs will be listed here -->
            </div>
        </div>
    </div>

    <!-- Create Playlist Modal -->
    <div id="createModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 modal-overlay">
        <div class="glass p-6 md:p-8 rounded-3xl w-full max-w-sm border border-white/10 shadow-2xl fade-in">
            <h3 class="text-xl md:text-2xl font-black mb-6 tracking-tight">Create New Playlist</h3>
            <input type="text" id="playlistNameInput" placeholder="Enter playlist name..." 
                class="modal-input w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 mb-4 focus:outline-none transition-all text-sm font-medium">
            <div class="flex gap-3">
                <button onclick="closeCreateModal()" class="flex-1 touch-target bg-white/5 hover:bg-white/10 text-white font-bold py-3 rounded-xl transition-all text-sm">Cancel</button>
                <button onclick="createPlaylistFromModal()" class="flex-1 touch-target sc-bg-orange text-white font-bold py-3 rounded-xl transition-all text-sm">Create</button>
            </div>
        </div>
    </div>

    <!-- Global Player Bar -->
    <div id="playerBar" class="fixed bottom-0 left-0 right-0 glass p-3 md:p-6 border-t border-white/5 z-50 transform translate-y-full transition-transform duration-500">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center gap-4 md:gap-6">
            <div class="flex items-center gap-3 md:gap-4 w-full md:w-1/3">
                <img id="playerThumb" src="" class="w-12 h-12 md:w-14 md:h-14 rounded-xl shadow-2xl bg-gray-800 object-cover">
                <div class="overflow-hidden">
                    <h4 id="playerTitle" class="font-black text-xs md:text-sm truncate"></h4>
                    <p id="playerAuthor" class="text-[9px] md:text-[10px] text-gray-500 font-bold uppercase truncate"></p>
                </div>
            </div>
            <div class="w-full md:w-2/3 flex items-center gap-3 md:gap-4">
                <audio id="audioPlayer" controls class="flex-1 h-9 md:h-10 w-full"></audio>
                <button onclick="closePlayer()" class="touch-target text-gray-600 hover:text-white"><i class="fas fa-times-circle text-lg md:text-xl"></i></button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBztF3TJ_2YSkZDNA8XgiQByQ_8NZCl644",
            authDomain: "mp3-and-users.firebaseapp.com",
            projectId: "mp3-and-users",
            storageBucket: "mp3-and-users.firebasestorage.app",
            messagingSenderId: "515605875722",
            appId: "1:515605875722:web:324bfb4a2843d972f8e3f3"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const API_BASE_URL = window.location.origin;
        let currentUser = null;
        let currentPlaylistId = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) window.location.href = 'login.html';
            else {
                currentUser = user;
                loadPlaylists();
            }
        });

        function showStatus(message, isError = false) {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = `mb-6 p-4 rounded-xl text-sm font-bold fade-in ${isError ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 'bg-green-500/10 text-green-400 border border-green-500/20'}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        async function loadPlaylists() {
            try {
                const idToken = await currentUser.getIdToken();
                const response = await fetch(`${API_BASE_URL}/api/user/playlists`, {
                    headers: { 'Authorization': `Bearer ${idToken}` }
                });
                
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }
                
                const data = await response.json();
                const container = document.getElementById('playlistContent');
                
                if (data.length > 0) {
                    container.innerHTML = data.map(pl => `
                        <div onclick="showSongsView('${pl.id}', '${pl.name.replace(/'/g, "\\'")}', ${JSON.stringify(pl.songs || []).replace(/'/g, "&#39;")})" 
                            class="glass p-4 md:p-6 rounded-3xl aspect-square flex flex-col justify-center items-center gap-3 md:gap-4 hover:bg-white/5 transition-all cursor-pointer group playlist-card fade-in">
                            <div class="w-16 h-16 md:w-20 md:h-20 bg-gray-800 rounded-2xl flex items-center justify-center group-hover:bg-orange-500 transition-colors">
                                <i class="fas fa-compact-disc text-2xl md:text-3xl text-gray-600 group-hover:text-white"></i>
                            </div>
                            <h4 class="font-black text-center tracking-tight text-xs md:text-sm truncate w-full">${pl.name}</h4>
                            <p class="text-[9px] md:text-[10px] font-bold text-gray-500 uppercase tracking-widest">${(pl.songs || []).length} Songs</p>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p class="text-gray-700 font-bold uppercase tracking-widest text-xs py-20 text-center col-span-full">You haven\'t created any playlists yet.</p>';
                }
            } catch (error) {
                console.error("Load playlists error:", error);
                showStatus('Failed to load playlists. Please try again.', true);
            }
        }

        // Create playlist via modal (replaces prompt())
        window.showCreateModal = () => {
            document.getElementById('createModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('playlistNameInput').focus(), 100);
        };

        window.closeCreateModal = () => {
            document.getElementById('createModal').classList.add('hidden');
            document.getElementById('playlistNameInput').value = '';
        };

        window.createPlaylistFromModal = async () => {
            const nameInput = document.getElementById('playlistNameInput');
            const name = nameInput.value.trim();
            
            if (!name) {
                showStatus('Please enter a playlist name.', true);
                return;
            }
            
            try {
                const idToken = await currentUser.getIdToken();
                const response = await fetch(`${API_BASE_URL}/api/user/playlists/create`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${idToken}` 
                    },
                    body: JSON.stringify({ name })
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Failed to create playlist');
                }
                
                showStatus('Playlist created successfully!');
                closeCreateModal();
                await loadPlaylists();
            } catch (error) {
                console.error("Create playlist error:", error);
                showStatus('Failed to create playlist: ' + error.message, true);
            }
        };

        // Handle Enter key in modal
        document.getElementById('playlistNameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') createPlaylistFromModal();
        });

        // Show songs in a playlist
        window.showSongsView = (playlistId, playlistName, songs) => {
            currentPlaylistId = playlistId;
            document.getElementById('playlistContent').classList.add('hidden');
            document.getElementById('songsView').classList.remove('hidden');
            document.getElementById('currentPlaylistName').innerText = playlistName;
            
            const list = document.getElementById('songsList');
            if (songs && songs.length > 0) {
                list.innerHTML = songs.map((song, idx) => `
                    <div class="glass p-3 md:p-4 rounded-2xl flex items-center gap-3 md:gap-4 hover:bg-white/5 transition-colors cursor-pointer fade-in" 
                        onclick="playTrack('${song.url || ''}')">
                        <img src="${song.thumbnail || 'https://via.placeholder.com/48'}" 
                            class="w-10 h-10 md:w-12 md:h-12 rounded-xl bg-gray-800 object-cover flex-shrink-0">
                        <div class="flex-1 overflow-hidden">
                            <h4 class="font-black text-xs md:text-sm truncate">${song.title || 'Unknown'}</h4>
                            <p class="text-[9px] md:text-[10px] text-gray-500 font-bold uppercase truncate">${song.author || 'Jay SoundCloud'}</p>
                        </div>
                        <button onclick="event.stopPropagation(); removeSong('${song.url || ''}')" 
                            class="touch-target text-gray-600 hover:text-red-500 transition-colors flex-shrink-0">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `).join('');
            } else {
                list.innerHTML = '<p class="text-gray-700 font-bold uppercase tracking-widest text-xs py-20 text-center">This playlist is empty. Search for songs and add them!</p>';
            }
        };

        window.hideSongsView = () => {
            document.getElementById('playlistContent').classList.remove('hidden');
            document.getElementById('songsView').classList.add('hidden');
            currentPlaylistId = null;
        };

        window.removeSong = async (songUrl) => {
            if (!currentPlaylistId || !songUrl) return;
            try {
                const idToken = await currentUser.getIdToken();
                const response = await fetch(`${API_BASE_URL}/api/user/playlists/remove-song`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${idToken}` 
                    },
                    body: JSON.stringify({ playlistId: currentPlaylistId, songUrl })
                });
                const data = await response.json();
                if (data.success) {
                    showStatus('Song removed from playlist');
                    // Reload the playlist view
                    const token = await currentUser.getIdToken();
                    const res = await fetch(`${API_BASE_URL}/api/user/playlists`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const playlists = await res.json();
                    const pl = playlists.find(p => p.id === currentPlaylistId);
                    if (pl) showSongsView(pl.id, pl.name, pl.songs || []);
                }
            } catch (error) {
                console.error("Remove song error:", error);
            }
        };

        window.deleteCurrentPlaylist = async () => {
            if (!currentPlaylistId) return;
            if (!confirm('Delete this playlist?')) return;
            try {
                const idToken = await currentUser.getIdToken();
                const response = await fetch(`${API_BASE_URL}/api/user/playlists/${currentPlaylistId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${idToken}` }
                });
                const data = await response.json();
                if (data.success) {
                    showStatus('Playlist deleted');
                    hideSongsView();
                    loadPlaylists();
                }
            } catch (error) {
                console.error("Delete playlist error:", error);
            }
        };

        window.playTrack = async (url) => {
            const playerBar = document.getElementById('playerBar');
            const audioPlayer = document.getElementById('audioPlayer');
            try {
                const response = await fetch(`${API_BASE_URL}/api/download?link=${encodeURIComponent(url)}`);
                const data = await response.json();
                if (data.success && data.result) {
                    const track = data.result;
                    document.getElementById('playerThumb').src = track.thumbnail || 'https://via.placeholder.com/150';
                    document.getElementById('playerTitle').innerText = track.title;
                    document.getElementById('playerAuthor').innerText = track.author || 'Jay SoundCloud';
                    audioPlayer.src = track.downloadUrl;
                    playerBar.classList.remove('translate-y-full');
                    audioPlayer.play();
                }
            } catch (err) {
                console.error("Play track error:", err);
            }
        };

        window.closePlayer = () => {
            document.getElementById('playerBar').classList.add('translate-y-full');
            document.getElementById('audioPlayer').pause();
        };

        window.toggleMobileMenu = () => {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        };

        // Close mobile menu when clicking outside
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('mobileMenu');
            if (!e.target.closest('.mobile-nav') && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
