<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Jay SoundCloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f0f0f; color: #ffffff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sc-orange { color: #ff5500; }
        .sc-bg-orange { background-color: #ff5500; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass p-10 rounded-3xl w-full max-w-md shadow-2xl">
        <div class="text-center mb-10">
            <i class="fab fa-soundcloud text-6xl sc-orange mb-4"></i>
            <h1 class="text-3xl font-black tracking-tighter">JAY MUSIC</h1>
            <p class="text-gray-400 text-sm mt-2">Sign in to your account</p>
        </div>

        <!-- Auth Forms -->
        <div id="authForms" class="space-y-4">
            <div>
                <label class="text-[10px] font-bold uppercase tracking-widest text-gray-500 ml-1">Email Address</label>
                <input type="email" id="email" placeholder="email@example.com" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 mt-1 focus:ring-2 focus:ring-orange-500 outline-none transition-all">
            </div>
            <div>
                <label class="text-[10px] font-bold uppercase tracking-widest text-gray-500 ml-1">Password</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 mt-1 focus:ring-2 focus:ring-orange-500 outline-none transition-all">
            </div>
            
            <div class="flex flex-col gap-3 pt-4">
                <button onclick="handleAuth('login')" id="loginBtn" class="sc-bg-orange hover:bg-orange-600 text-white font-black py-4 rounded-xl transition-all shadow-lg shadow-orange-500/20 active:scale-95">
                    SIGN IN
                </button>
                <button onclick="handleAuth('signup')" id="signupBtn" class="bg-white/5 hover:bg-white/10 text-white font-bold py-4 rounded-xl transition-all border border-white/10">
                    CREATE ACCOUNT
                </button>
            </div>

            <div class="relative py-4">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/5"></div></div>
                <div class="relative flex justify-center text-xs uppercase"><span class="bg-[#1a1a1a] px-2 text-gray-500 font-bold">Or continue with</span></div>
            </div>

            <button onclick="handleGoogleSignIn()" class="w-full bg-white text-black font-black py-4 rounded-xl transition-all flex items-center justify-center gap-3 hover:scale-[1.02] active:scale-95">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5">
                GOOGLE
            </button>

            <div class="text-center mt-6">
                <button onclick="handleForgotPassword()" class="text-xs text-gray-500 hover:text-white transition-colors">Forgot Password?</button>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="hidden flex flex-col items-center py-10">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-orange-500 border-t-transparent mb-4"></div>
            <p class="text-sm font-bold tracking-widest text-gray-400">AUTHENTICATING...</p>
        </div>

        <p id="message" class="text-center text-xs mt-6 h-4 font-medium"></p>
        
        <div class="mt-10 pt-6 border-t border-white/5 text-center">
            <p class="text-gray-500 text-[10px] tracking-widest uppercase">Made by <span class="text-white">Jay Bohol</span></p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup,
            sendPasswordResetEmail,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // --- PASTE YOUR FIREBASE CONFIG HERE ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // Check if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = 'index.html';
        });

        window.handleAuth = async (type) => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');
            
            if (!email || !password) return showMsg('Please fill all fields', 'red');

            showLoading(true);
            try {
                if (type === 'login') {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
                window.location.href = 'index.html';
            } catch (error) {
                showMsg(error.message, 'red');
                showLoading(false);
            }
        };

        window.handleGoogleSignIn = async () => {
            showLoading(true);
            try {
                await signInWithPopup(auth, googleProvider);
                window.location.href = 'index.html';
            } catch (error) {
                showMsg(error.message, 'red');
                showLoading(false);
            }
        };

        window.handleForgotPassword = async () => {
            const email = document.getElementById('email').value;
            if (!email) return showMsg('Enter your email first', 'orange');
            try {
                await sendPasswordResetEmail(auth, email);
                showMsg('Password reset email sent!', 'green');
            } catch (error) {
                showMsg(error.message, 'red');
            }
        };

        function showLoading(show) {
            document.getElementById('authForms').classList.toggle('hidden', show);
            document.getElementById('loadingOverlay').classList.toggle('hidden', !show);
        }

        function showMsg(text, color) {
            const el = document.getElementById('message');
            el.innerText = text;
            el.style.color = color === 'red' ? '#ef4444' : color === 'green' ? '#22c55e' : '#f97316';
        }
    </script>
</body>
</html>
