<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Jay SoundCloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f0f0f; color: #ffffff; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sc-orange { color: #ff5500; }
        .sc-bg-orange { background-color: #ff5500; }
        
        /* Touch targets for mobile */
        .touch-target { min-height: 44px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass p-6 sm:p-10 rounded-2xl sm:rounded-3xl w-full max-w-md shadow-2xl border border-white/5">
        <div class="text-center mb-8 md:mb-10">
            <i class="fab fa-soundcloud text-5xl sm:text-6xl sc-orange mb-3 md:mb-4"></i>
            <h1 class="text-2xl sm:text-3xl font-black tracking-tighter uppercase">Jay <span class="sc-orange">Music</span></h1>
            <p class="text-gray-500 text-[10px] sm:text-xs font-bold uppercase tracking-widest mt-2">Premium Audio Experience</p>
        </div>

        <div id="authForms" class="space-y-4">
            <div class="space-y-3 sm:space-y-4">
                <input type="email" id="email" placeholder="Email Address" 
                    class="touch-target w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 sm:py-4 focus:ring-2 focus:ring-orange-500 outline-none transition-all text-sm font-medium">
                <input type="password" id="password" placeholder="Password" 
                    class="touch-target w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 sm:py-4 focus:ring-2 focus:ring-orange-500 outline-none transition-all text-sm font-medium">
            </div>
            
            <div class="flex flex-col gap-3 pt-2 sm:pt-4">
                <button onclick="handleAuth('login')" class="touch-target sc-bg-orange hover:bg-orange-600 text-white font-black py-3 sm:py-4 rounded-xl transition-all shadow-lg shadow-orange-500/20 active:scale-95 uppercase tracking-widest text-xs">Sign In</button>
                <button onclick="handleAuth('signup')" class="touch-target bg-white/5 hover:bg-white/10 text-white font-bold py-3 sm:py-4 rounded-xl transition-all border border-white/10 uppercase tracking-widest text-xs">Create Account</button>
            </div>

            <div class="relative py-4 sm:py-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/5"></div></div>
                <div class="relative flex justify-center text-[10px] uppercase font-black tracking-[0.2em]"><span class="bg-[#0f0f0f] px-4 text-gray-600">Secure Access</span></div>
            </div>

            <button onclick="handleGoogleSignIn()" class="touch-target w-full bg-white text-black font-black py-3 sm:py-4 rounded-xl transition-all flex items-center justify-center gap-3 hover:scale-[1.02] active:scale-95 shadow-xl">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-4 sm:w-5 h-4 sm:h-5">
                CONTINUE WITH GOOGLE
            </button>
        </div>

        <div id="loadingOverlay" class="hidden flex flex-col items-center py-8 sm:py-10">
            <div class="animate-spin rounded-full h-10 w-10 sm:h-12 sm:w-12 border-4 border-orange-500 border-t-transparent mb-4"></div>
            <p class="text-[10px] font-black tracking-widest text-gray-500 uppercase">Verifying Identity...</p>
        </div>

        <p id="message" class="text-center text-[10px] mt-4 sm:mt-6 h-4 font-bold uppercase tracking-wider text-red-500"></p>
        
        <div class="mt-6 sm:mt-10 pt-4 sm:pt-6 border-t border-white/5 text-center">
            <p class="text-gray-600 text-[8px] sm:text-[9px] font-black tracking-widest uppercase">Made by <span class="text-gray-400">Jay Bohol</span></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBztF3TJ_2YSkZDNA8XgiQByQ_8NZCl644",
            authDomain: "mp3-and-users.firebaseapp.com",
            projectId: "mp3-and-users",
            storageBucket: "mp3-and-users.firebasestorage.app",
            messagingSenderId: "515605875722",
            appId: "1:515605875722:web:324bfb4a2843d972f8e3f3"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = 'index.html';
        });

        window.handleAuth = async (type) => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) return showMsg('All fields required');

            showLoading(true);
            try {
                if (type === 'login') await signInWithEmailAndPassword(auth, email, password);
                else await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                showMsg(error.message);
                showLoading(false);
            }
        };

        window.handleGoogleSignIn = async () => {
            showLoading(true);
            try {
                await signInWithPopup(auth, googleProvider);
            } catch (error) {
                showMsg(error.message);
                showLoading(false);
            }
        };

        function showLoading(show) {
            document.getElementById('authForms').classList.toggle('hidden', show);
            document.getElementById('loadingOverlay').classList.toggle('hidden', !show);
        }

        function showMsg(text) {
            document.getElementById('message').innerText = text;
        }
    </script>
</body>
</html>
