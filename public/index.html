<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay SoundCloud - Premium Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f0f0f; color: #ffffff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sc-orange { color: #ff5500; }
        .sc-bg-orange { background-color: #ff5500; }
        .hero-gradient { background: linear-gradient(135deg, #ff5500 0%, #ff2200 100%); }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-6xl mx-auto p-6 md:p-10">
        <header class="flex justify-between items-center mb-16">
            <div class="flex items-center gap-3">
                <i class="fab fa-soundcloud text-4xl sc-orange"></i>
                <span class="text-xl font-black tracking-tighter">JAY MUSIC</span>
            </div>
            <nav class="flex gap-8 text-xs font-bold uppercase tracking-widest text-gray-500 items-center">
                <a href="index.html" class="text-white">Home</a>
                <a href="search.html" class="hover:text-white transition-colors">Search</a>
                <a href="library.html" class="hover:text-white transition-colors">Library</a>
                <a href="playlist.html" class="hover:text-white transition-colors">Playlists</a>
                <button onclick="handleLogout()" class="bg-white/5 px-4 py-2 rounded-full hover:bg-white/10 transition-colors">Logout</button>
            </nav>
        </header>

        <main>
            <div class="hero-gradient p-12 md:p-20 rounded-[40px] mb-16 relative overflow-hidden shadow-2xl">
                <div class="relative z-10 max-w-2xl">
                    <h1 class="text-6xl md:text-8xl font-black tracking-tighter mb-6 leading-none">DISCOVER <br>YOUR SOUND.</h1>
                    <p class="text-lg md:text-xl font-medium mb-10 opacity-90">Unlimited music streaming powered by Jay SoundCloud. Your private library, synced everywhere.</p>
                    <div class="flex gap-4">
                        <a href="search.html" class="bg-black text-white font-black px-10 py-5 rounded-2xl hover:scale-105 transition-transform inline-block">START SEARCHING</a>
                        <a href="library.html" class="bg-white/20 backdrop-blur-md text-white font-black px-10 py-5 rounded-2xl hover:bg-white/30 transition-all inline-block">YOUR LIBRARY</a>
                    </div>
                </div>
                <i class="fab fa-soundcloud absolute -right-20 -bottom-20 text-[400px] opacity-10 rotate-12"></i>
            </div>

            <section class="mb-16">
                <div class="flex justify-between items-end mb-8">
                    <h2 class="text-3xl font-black tracking-tight">Recently Played</h2>
                    <a href="library.html" class="text-xs font-bold text-gray-500 uppercase tracking-widest hover:text-white transition-colors">View All</a>
                </div>
                <div id="recentlyPlayed" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6">
                    <!-- Recently played items will be injected here -->
                </div>
            </section>

            <footer class="mt-32 pt-12 border-t border-white/5 text-center">
                <p class="text-gray-600 text-[10px] font-bold uppercase tracking-[0.3em]">Developed by <span class="text-gray-400">Jay Bohol</span></p>
                <div class="flex justify-center gap-6 mt-6">
                    <a href="https://www.facebook.com/profile.php?id=61590490534032" target="_blank" class="text-gray-500 hover:text-white transition-colors"><i class="fab fa-facebook text-xl"></i></a>
                    <a href="#" class="text-gray-500 hover:text-white transition-colors"><i class="fab fa-instagram text-xl"></i></a>
                    <a href="#" class="text-gray-500 hover:text-white transition-colors"><i class="fab fa-twitter text-xl"></i></a>
                </div>
            </footer>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        const firebaseConfig = { /* PASTE CONFIG HERE */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const API_BASE_URL = window.location.origin;

        onAuthStateChanged(auth, async (user) => {
            if (!user) window.location.href = 'login.html';
            else {
                const idToken = await user.getIdToken();
                const response = await fetch(`${API_BASE_URL}/api/user/recentlyPlayed`, {
                    headers: { 'Authorization': `Bearer ${idToken}` }
                });
                const data = await response.json();
                const container = document.getElementById('recentlyPlayed');
                if (data.length > 0) {
                    container.innerHTML = data.slice(0, 6).map(track => `
                        <div class="glass p-4 rounded-2xl hover:bg-white/5 transition-all cursor-pointer group">
                            <div class="aspect-square bg-gray-800 rounded-xl mb-4 overflow-hidden">
                                <img src="${track.thumbnail || ''}" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition-opacity">
                            </div>
                            <h4 class="font-black text-xs truncate mb-1 tracking-tight">${track.title}</h4>
                            <p class="text-[9px] text-gray-500 font-bold uppercase truncate tracking-widest">${track.author || 'SoundCloud'}</p>
                        </div>
                    `).join('');
                }
            }
        });

        window.handleLogout = () => signOut(auth);
    </script>
</body>
</html>
