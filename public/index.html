<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay SoundCloud - Search & Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #0f0f0f;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .sc-orange {
            color: #ff5500;
        }
        .sc-bg-orange {
            background-color: #ff5500;
        }
        .track-card:hover {
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-2px);
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col">
    <!-- CONFIGURATION -->
    <script>
        // Set this to the URL where your Express API is hosted (e.g., https://jayspotifyweb.onrender.com)
        // If the index.html is on the same server as the API, leave it as an empty string ''
        const API_BASE_URL = 'https://jayspotifyweb.onrender.com';
    </script>

    <div class="max-w-5xl mx-auto w-full flex-1">
        <!-- Header -->
        <header class="text-center mb-12 mt-4">
            <div class="inline-block mb-4 animate-float">
                <i class="fab fa-soundcloud text-7xl sc-orange"></i>
            </div>
            <h1 class="text-5xl font-black tracking-tighter mb-2">
                JAY <span class="sc-orange">SOUNDCLOUD</span>
            </h1>
            <p class="text-gray-400 font-medium tracking-wide">Premium Search & Downloader Experience</p>
            
            <div class="mt-4 flex justify-center items-center gap-4 text-xs font-bold uppercase tracking-widest text-gray-500">
                <span>Made by Jay Bohol</span>
                <span class="w-1 h-1 bg-gray-700 rounded-full"></span>
                <a href="https://www.facebook.com/profile.php?id=61590490534032" target="_blank" class="hover:text-white transition-colors">Facebook</a>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="glass p-2 rounded-2xl mb-12 max-w-2xl mx-auto shadow-2xl">
            <div class="flex flex-col md:flex-row gap-2">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search for songs, artists, or links..." 
                    class="flex-1 bg-transparent border-none rounded-xl px-6 py-4 focus:outline-none text-lg font-medium"
                >
                <button 
                    onclick="searchSongs()" 
                    id="searchBtn"
                    class="sc-bg-orange hover:bg-orange-600 text-white font-black py-4 px-10 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-orange-500/20 active:scale-95"
                >
                    <i class="fas fa-search"></i> SEARCH
                </button>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="hidden text-center py-20">
            <div class="inline-block animate-spin rounded-full h-14 w-14 border-4 border-orange-500 border-t-transparent shadow-orange-500/20 shadow-xl"></div>
            <p class="mt-6 text-gray-400 font-bold tracking-widest uppercase text-xs">Fetching tracks from the cloud...</p>
        </div>

        <!-- Results Section -->
        <div id="results" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-24">
            <!-- Results will be injected here -->
            <div class="col-span-full text-center py-20 opacity-20" id="emptyState">
                <i class="fas fa-music text-8xl mb-6"></i>
                <p class="text-xl font-bold">Your playlist starts here</p>
            </div>
        </div>
    </div>

    <!-- Player Modal (Floating) -->
    <div id="playerContainer" class="fixed bottom-6 left-4 right-4 md:left-1/2 md:-translate-x-1/2 md:max-w-3xl glass p-4 rounded-3xl transform translate-y-[150%] transition-transform duration-500 z-50 shadow-2xl border border-white/10">
        <div class="flex flex-col md:flex-row items-center gap-6">
            <div class="flex items-center gap-4 flex-1 w-full">
                <div class="w-16 h-16 rounded-2xl overflow-hidden shadow-xl bg-gray-800 flex-shrink-0">
                    <img id="playerThumb" src="" alt="" class="w-full h-full object-cover">
                </div>
                <div class="overflow-hidden">
                    <h3 id="playerTitle" class="font-black text-lg truncate mb-0.5"></h3>
                    <p id="playerAuthor" class="text-sm text-gray-400 font-bold truncate uppercase tracking-tighter"></p>
                </div>
            </div>
            
            <div class="w-full md:w-auto flex items-center gap-4">
                <audio id="audioPlayer" controls class="h-10 flex-1 md:w-64"></audio>
                <button onclick="closePlayer()" class="text-gray-500 hover:text-white p-2 transition-colors">
                    <i class="fas fa-times-circle text-2xl"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsDiv = document.getElementById('results');
        const loading = document.getElementById('loading');
        const playerContainer = document.getElementById('playerContainer');
        const audioPlayer = document.getElementById('audioPlayer');
        const emptyState = document.getElementById('emptyState');

        // Handle Enter key
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchSongs();
        });

        async function searchSongs() {
            const query = searchInput.value.trim();
            if (!query) return;

            // UI Reset
            resultsDiv.innerHTML = '';
            loading.classList.remove('hidden');
            if(emptyState) emptyState.classList.add('hidden');
            searchBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/api/search?query=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data.succes && data.result && data.result.length > 0) {
                    displayResults(data.result);
                } else {
                    resultsDiv.innerHTML = '<p class="col-span-full text-center text-gray-500 py-10 font-bold uppercase tracking-widest text-xs">No tracks found. Try another search.</p>';
                }
            } catch (error) {
                console.error('Search error:', error);
                resultsDiv.innerHTML = '<p class="col-span-full text-center text-red-400 py-10 font-bold">API connection error. Please check your server.</p>';
            } finally {
                loading.classList.add('hidden');
                searchBtn.disabled = false;
            }
        }

        function displayResults(tracks) {
            resultsDiv.innerHTML = tracks.map((track) => `
                <div class="glass p-6 rounded-2xl flex flex-col justify-between transition-all duration-300 track-card group">
                    <div class="mb-6">
                        <div class="w-full aspect-video bg-gray-800 rounded-xl mb-4 overflow-hidden relative">
                             <img src="https://images.unsplash.com/photo-1514525253361-bee8718a74a2?w=400&h=225&fit=crop" class="w-full h-full object-cover opacity-40 group-hover:opacity-100 transition-opacity duration-500">
                             <div class="absolute inset-0 flex items-center justify-center">
                                <i class="fab fa-soundcloud text-4xl text-white/20 group-hover:text-orange-500 transition-colors"></i>
                             </div>
                        </div>
                        <h3 class="font-black text-xl mb-2 line-clamp-2 tracking-tight group-hover:text-orange-500 transition-colors">${track.title}</h3>
                        <p class="text-xs text-gray-500 font-bold truncate uppercase tracking-widest">${track.url}</p>
                    </div>
                    <div class="flex gap-3">
                        <button 
                            onclick="getDownloadInfo('${track.url}', this)" 
                            class="flex-1 sc-bg-orange hover:bg-orange-600 text-white py-3 rounded-xl font-black transition-all flex items-center justify-center gap-2 active:scale-95 shadow-lg shadow-orange-500/10"
                        >
                            <i class="fas fa-play"></i> PLAY NOW
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function getDownloadInfo(link, btn) {
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner animate-spin"></i> LOADING...';

            try {
                const response = await fetch(`${API_BASE_URL}/api/download?link=${encodeURIComponent(link)}`);
                const data = await response.json();

                if (data.success && data.result) {
                    playTrack(data.result);
                } else {
                    alert('Could not retrieve audio source.');
                }
            } catch (error) {
                console.error('Download error:', error);
                alert('Error fetching track details.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        function playTrack(track) {
            document.getElementById('playerThumb').src = track.thumbnail || 'https://via.placeholder.com/150';
            document.getElementById('playerTitle').innerText = track.title;
            document.getElementById('playerAuthor').innerText = track.author || 'Jay SoundCloud Artist';
            
            audioPlayer.src = track.downloadUrl;
            playerContainer.classList.remove('translate-y-[150%]');
            audioPlayer.play();
        }

        function closePlayer() {
            playerContainer.classList.add('translate-y-[150%]');
            audioPlayer.pause();
        }
    </script>
</body>
</html>
