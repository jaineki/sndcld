<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay SoundCloud - Search & Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f0f0f; color: #ffffff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sc-orange { color: #ff5500; }
        .sc-bg-orange { background-color: #ff5500; }
        .track-card:hover { background: rgba(255, 255, 255, 0.07); transform: translateY(-2px); }
        .sidebar-item:hover { color: #ff5500; }
        .sidebar-item.active { color: #ff5500; font-weight: 900; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row opacity-0 transition-opacity duration-500" id="body">
    
    <!-- Sidebar -->
    <aside class="w-full md:w-64 glass md:h-screen p-6 flex flex-col gap-8 z-20">
        <div class="flex items-center gap-3">
            <i class="fab fa-soundcloud text-4xl sc-orange"></i>
            <span class="text-xl font-black tracking-tighter">JAY MUSIC</span>
        </div>

        <nav class="flex flex-col gap-6 text-gray-400 font-bold text-sm tracking-widest uppercase">
            <a href="#" onclick="showView('home')" id="nav-home" class="sidebar-item active flex items-center gap-4 transition-colors"><i class="fas fa-home"></i> Home</a>
            <a href="#" onclick="showView('search')" id="nav-search" class="sidebar-item flex items-center gap-4 transition-colors"><i class="fas fa-search"></i> Search</a>
            <a href="#" onclick="showView('library')" id="nav-library" class="sidebar-item flex items-center gap-4 transition-colors"><i class="fas fa-layer-group"></i> Library</a>
            <a href="#" onclick="showView('playlists')" id="nav-playlists" class="sidebar-item flex items-center gap-4 transition-colors"><i class="fas fa-list-ul"></i> Playlists</a>
        </nav>

        <div class="mt-auto pt-6 border-t border-white/5">
            <div class="flex items-center gap-3 mb-6">
                <img id="userPhoto" src="" class="w-10 h-10 rounded-full bg-gray-800 hidden">
                <div class="w-10 h-10 rounded-full bg-orange-500 flex items-center justify-center font-bold text-black" id="userInitial">J</div>
                <div class="overflow-hidden">
                    <p class="text-xs font-black truncate" id="userName">User Name</p>
                    <button onclick="handleLogout()" class="text-[10px] text-gray-500 hover:text-white uppercase font-bold">Sign Out</button>
                </div>
            </div>
            <p class="text-[9px] text-gray-600 font-bold uppercase tracking-widest">Made by Jay Bohol</p>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 h-screen overflow-y-auto p-6 md:p-10 relative pb-32">
        
        <!-- Views -->
        <div id="view-home" class="view-content">
            <h2 class="text-4xl font-black mb-8 tracking-tighter">Welcome Back, <span class="sc-orange" id="greetingName">Jay</span></h2>
            
            <section class="mb-12">
                <h3 class="text-xs font-black text-gray-500 uppercase tracking-[0.3em] mb-6">Recently Played</h3>
                <div id="recentlyPlayed" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                    <p class="text-gray-700 text-xs italic col-span-full">No recently played tracks yet.</p>
                </div>
            </section>
        </div>

        <div id="view-search" class="view-content hidden">
            <div class="max-w-2xl mb-12">
                <h2 class="text-4xl font-black mb-6 tracking-tighter uppercase">Search <span class="sc-orange">Music</span></h2>
                <div class="glass p-2 rounded-2xl flex gap-2">
                    <input type="text" id="searchInput" placeholder="Song, Artist, or Link..." class="flex-1 bg-transparent border-none px-6 py-4 focus:outline-none text-lg font-medium">
                    <button onclick="searchSongs()" id="searchBtn" class="sc-bg-orange hover:bg-orange-600 text-white font-black px-8 rounded-xl transition-all active:scale-95">SEARCH</button>
                </div>
            </div>

            <div id="loading" class="hidden py-20 text-center">
                <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-orange-500 border-t-transparent mb-4"></div>
                <p class="text-xs font-bold text-gray-500 uppercase tracking-widest">Searching the cloud...</p>
            </div>

            <div id="results" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <div id="view-library" class="view-content hidden">
            <h2 class="text-4xl font-black mb-8 tracking-tighter uppercase">Your <span class="sc-orange">Library</span></h2>
            <div id="libraryList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <div id="view-playlists" class="view-content hidden">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-4xl font-black tracking-tighter uppercase">Your <span class="sc-orange">Playlists</span></h2>
                <button onclick="createPlaylist()" class="bg-white text-black font-black px-6 py-2 rounded-full text-xs hover:scale-105 transition-transform">NEW PLAYLIST</button>
            </div>
            <div id="playlistList" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6"></div>
        </div>

    </main>

    <!-- Player Bar -->
    <div id="playerBar" class="fixed bottom-0 left-0 right-0 glass p-4 md:p-6 border-t border-white/5 z-50 transform translate-y-full transition-transform duration-500">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center gap-6">
            <div class="flex items-center gap-4 w-full md:w-1/3">
                <img id="playerThumb" src="" class="w-14 h-14 rounded-xl shadow-2xl bg-gray-800 object-cover">
                <div class="overflow-hidden">
                    <h4 id="playerTitle" class="font-black text-sm truncate"></h4>
                    <p id="playerAuthor" class="text-[10px] text-gray-500 font-bold uppercase truncate"></p>
                </div>
                <button id="likeBtn" class="text-gray-600 hover:text-orange-500 transition-colors ml-2"><i class="fas fa-heart"></i></button>
            </div>
            <div class="w-full md:w-2/3 flex items-center gap-4">
                <audio id="audioPlayer" controls class="flex-1 h-10"></audio>
                <button onclick="closePlayer()" class="text-gray-600 hover:text-white"><i class="fas fa-times-circle text-xl"></i></button>
            </div>
        </div>
    </div>

    <!-- Firebase & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- PASTE YOUR FIREBASE CONFIG HERE ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const API_BASE_URL = window.location.origin;
        let currentUser = null;

        // Auth State
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                currentUser = user;
                document.getElementById('body').classList.remove('opacity-0');
                updateUserUI(user);
                await syncUser(user);
                loadLibrary();
            }
        });

        async function syncUser(user) {
            const idToken = await user.getIdToken();
            await fetch(`${API_BASE_URL}/api/user/sync`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${idToken}`
                },
                body: JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    displayName: user.displayName || user.email.split('@')[0],
                    photoURL: user.photoURL,
                    provider: user.providerData[0].providerId
                })
            });
        }

        function updateUserUI(user) {
            const name = user.displayName || user.email.split('@')[0];
            document.getElementById('userName').innerText = name;
            document.getElementById('greetingName').innerText = name;
            document.getElementById('userInitial').innerText = name[0].toUpperCase();
            if (user.photoURL) {
                document.getElementById('userPhoto').src = user.photoURL;
                document.getElementById('userPhoto').classList.remove('hidden');
                document.getElementById('userInitial').classList.add('hidden');
            }
        }

        window.handleLogout = () => signOut(auth);

        // Navigation
        window.showView = (viewId) => {
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.getElementById(`view-${viewId}`).classList.remove('hidden');
            document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
            document.getElementById(`nav-${viewId}`).classList.add('active');
        };

        // Search Logic
        window.searchSongs = async () => {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsDiv = document.getElementById('results');
            const loading = document.getElementById('loading');
            resultsDiv.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE_URL}/api/search?query=${encodeURIComponent(query)}`);
                const data = await response.json();
                loading.classList.add('hidden');

                if (data.succes && data.result) {
                    displayResults(data.result);
                    saveHistory(query);
                }
            } catch (err) {
                loading.classList.add('hidden');
            }
        };

        function displayResults(tracks) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = tracks.map(track => `
                <div class="glass p-5 rounded-2xl track-card group transition-all duration-300">
                    <div class="aspect-square bg-gray-800 rounded-xl mb-4 overflow-hidden relative">
                        <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=400" class="w-full h-full object-cover opacity-40 group-hover:opacity-100 transition-opacity">
                        <button onclick="playTrack('${track.url}', '${track.title.replace(/'/g, "\\'")}')" class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <i class="fas fa-play-circle text-6xl text-orange-500 shadow-2xl"></i>
                        </button>
                    </div>
                    <h4 class="font-black text-lg truncate mb-1">${track.title}</h4>
                    <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest truncate">${track.url}</p>
                </div>
            `).join('');
        }

        window.playTrack = async (url, title) => {
            const playerBar = document.getElementById('playerBar');
            const audioPlayer = document.getElementById('audioPlayer');
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/download?link=${encodeURIComponent(url)}`);
                const data = await response.json();
                
                if (data.success && data.result) {
                    const track = data.result;
                    document.getElementById('playerThumb').src = track.thumbnail || 'https://via.placeholder.com/150';
                    document.getElementById('playerTitle').innerText = track.title;
                    document.getElementById('playerAuthor').innerText = track.author || 'Jay SoundCloud';
                    
                    audioPlayer.src = track.downloadUrl;
                    playerBar.classList.remove('translate-y-full');
                    audioPlayer.play();
                    
                    saveRecent(track);
                }
            } catch (err) {
                alert('Playback error');
            }
        };

        window.closePlayer = () => {
            document.getElementById('playerBar').classList.add('translate-y-full');
            document.getElementById('audioPlayer').pause();
        };

        // Firebase Library Logic
        async function saveHistory(queryText) {
            if (!currentUser) return;
            const q = query(collection(db, `users/${currentUser.uid}/searchHistory`), where("query", "==", queryText));
            const snap = await getDocs(q);
            if (snap.empty) {
                await addDoc(collection(db, `users/${currentUser.uid}/searchHistory`), {
                    query: queryText,
                    createdAt: serverTimestamp()
                });
            }
        }

        async function saveRecent(track) {
            if (!currentUser) return;
            const docId = btoa(track.title).substring(0, 20); // Simple ID
            await setDoc(doc(db, `users/${currentUser.uid}/recentlyPlayed`, docId), {
                title: track.title,
                author: track.author,
                thumbnail: track.thumbnail,
                url: track.url,
                playedAt: serverTimestamp()
            }, { merge: true });
            loadRecent();
        }

        async function loadRecent() {
            if (!currentUser) return;
            const q = query(collection(db, `users/${currentUser.uid}/recentlyPlayed`), where("playedAt", "!=", null));
            const snap = await getDocs(q);
            const container = document.getElementById('recentlyPlayed');
            if (!snap.empty) {
                container.innerHTML = snap.docs.map(d => {
                    const t = d.data();
                    return `
                        <div class="glass p-3 rounded-xl flex items-center gap-3 cursor-pointer hover:bg-white/5" onclick="playTrack('${t.url}', '${t.title.replace(/'/g, "\\'")}')">
                            <img src="${t.thumbnail || ''}" class="w-10 h-10 rounded-lg bg-gray-800">
                            <div class="overflow-hidden"><p class="text-[10px] font-black truncate">${t.title}</p></div>
                        </div>
                    `;
                }).join('');
            }
        }

        async function loadLibrary() {
            loadRecent();
            // Implement other library loaders here...
        }

        // Global key handlers
        document.getElementById('searchInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') searchSongs(); });
    </script>
</body>
</html>
