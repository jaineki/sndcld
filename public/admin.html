<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Jay Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f0f0f; color: #ffffff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sc-orange { color: #ff5500; }
        .sc-bg-orange { background-color: #ff5500; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .spinner { border: 3px solid rgba(255, 85, 0, 0.2); border-top: 3px solid #ff5500; border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .tab-active { border-bottom: 2px solid #ff5500; color: #ff5500; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10">
    <div id="loginView" class="max-w-md mx-auto mt-20 glass p-8 rounded-3xl fade-in">
        <h2 class="text-2xl font-black mb-6 text-center uppercase tracking-tighter">Admin <span class="sc-orange">Login</span></h2>
        <div class="space-y-4">
            <input type="text" id="username" placeholder="Username" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500 transition-all">
            <input type="password" id="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500 transition-all">
            <button onclick="login()" id="loginBtn" class="w-full sc-bg-orange text-white font-black py-3 rounded-xl hover:bg-orange-600 transition-all">LOGIN</button>
            <p id="loginError" class="text-red-500 text-xs font-bold text-center mt-2 hidden"></p>
        </div>
    </div>

    <div id="dashboardView" class="hidden max-w-6xl mx-auto fade-in">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-3xl font-black tracking-tighter uppercase">Admin <span class="sc-orange">Dashboard</span></h2>
            <button onclick="logout()" class="bg-white/5 hover:bg-white/10 text-white font-bold px-6 py-2 rounded-xl border border-white/10 transition-all text-sm">LOGOUT</button>
        </div>

        <!-- Tabs -->
        <div class="flex gap-8 mb-8 border-b border-white/5">
            <button id="tabSongs" onclick="switchTab('songs')" class="pb-4 font-black uppercase tracking-widest text-xs tab-active">Songs Collection</button>
            <button id="tabUsers" onclick="switchTab('users')" class="pb-4 font-black uppercase tracking-widest text-xs text-gray-500">User Management</button>
        </div>

        <!-- Songs View -->
        <div id="songsSection" class="fade-in">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div class="glass p-6 rounded-3xl">
                    <p class="text-gray-500 text-xs font-bold uppercase tracking-widest mb-1">Total Cached Songs</p>
                    <h3 id="totalSongs" class="text-4xl font-black">0</h3>
                </div>
                <div class="glass p-6 rounded-3xl">
                    <p class="text-gray-500 text-xs font-bold uppercase tracking-widest mb-1">Storage</p>
                    <h3 class="text-2xl font-black text-green-500">Firebase Storage</h3>
                </div>
                <div class="glass p-6 rounded-3xl">
                    <p class="text-gray-500 text-xs font-bold uppercase tracking-widest mb-1">Database</p>
                    <h3 class="text-2xl font-black text-orange-500">MongoDB</h3>
                </div>
            </div>

            <div class="glass rounded-3xl overflow-hidden">
                <div class="p-6 border-b border-white/5 flex justify-between items-center">
                    <h3 class="font-black uppercase tracking-widest text-sm">Cached MP3 Collection</h3>
                    <button onclick="loadSongs()" class="text-orange-500 hover:text-orange-400 text-sm font-bold"><i class="fas fa-sync-alt mr-1"></i> REFRESH</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-white/5 text-[10px] font-bold uppercase tracking-widest text-gray-500">
                            <tr>
                                <th class="px-6 py-4">Song Info</th>
                                <th class="px-6 py-4">Cached At</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="songList" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Users View -->
        <div id="usersSection" class="hidden fade-in">
            <div class="glass rounded-3xl overflow-hidden">
                <div class="p-6 border-b border-white/5 flex justify-between items-center">
                    <h3 class="font-black uppercase tracking-widest text-sm">User Management</h3>
                    <button onclick="loadUsers()" class="text-orange-500 hover:text-orange-400 text-sm font-bold"><i class="fas fa-sync-alt mr-1"></i> REFRESH</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-white/5 text-[10px] font-bold uppercase tracking-widest text-gray-500">
                            <tr>
                                <th class="px-6 py-4">User Email</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4">Usage (Today)</th>
                                <th class="px-6 py-4">Expires At</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="userList" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="loading" class="py-20 text-center hidden">
            <div class="spinner mb-4"></div>
            <p class="text-xs text-gray-500 font-bold uppercase">Loading data...</p>
        </div>
    </div>

    <!-- Status Update Modal -->
    <div id="statusModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-sm fade-in">
            <h3 class="text-xl font-black mb-6 uppercase tracking-tighter">Update User <span class="sc-orange">Status</span></h3>
            <input type="hidden" id="targetUid">
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold uppercase text-gray-500 mb-2 block">Plan Type</label>
                    <select id="newStatus" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500">
                        <option value="free">Free (Limited)</option>
                        <option value="starter">Starter (3 Days)</option>
                        <option value="popular">Popular (7 Days)</option>
                        <option value="premium">Premium (30 Days)</option>
                    </select>
                </div>
                <div id="daysInputGroup">
                    <label class="text-[10px] font-bold uppercase text-gray-500 mb-2 block">Custom Days (Optional)</label>
                    <input type="number" id="customDays" placeholder="e.g. 3, 7, 30" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500">
                </div>
                <div class="flex gap-3 pt-4">
                    <button onclick="closeStatusModal()" class="flex-1 bg-white/5 py-3 rounded-xl font-bold text-xs uppercase">Cancel</button>
                    <button onclick="updateUserStatus()" class="flex-1 sc-bg-orange py-3 rounded-xl font-black text-xs uppercase">Update</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;

        async function checkAuth() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/admin/check`);
                const data = await res.json();
                if (data.isAdmin) showDashboard();
            } catch (e) {}
        }

        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const error = document.getElementById('loginError');

            btn.disabled = true;
            btn.innerHTML = '<div class="spinner w-4 h-4"></div>';
            error.classList.add('hidden');

            try {
                const res = await fetch(`${API_BASE_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();
                if (data.success) showDashboard();
                else {
                    error.textContent = data.message || "Login failed";
                    error.classList.remove('hidden');
                }
            } catch (e) {
                error.textContent = "Server error";
                error.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'LOGIN';
            }
        }

        async function logout() {
            await fetch(`${API_BASE_URL}/api/admin/logout`, { method: 'POST' });
            location.reload();
        }

        function showDashboard() {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            loadSongs();
        }

        function switchTab(tab) {
            const songsSec = document.getElementById('songsSection');
            const usersSec = document.getElementById('usersSection');
            const tabSongs = document.getElementById('tabSongs');
            const tabUsers = document.getElementById('tabUsers');

            if (tab === 'songs') {
                songsSec.classList.remove('hidden');
                usersSec.classList.add('hidden');
                tabSongs.classList.add('tab-active');
                tabUsers.classList.remove('tab-active');
                tabUsers.classList.add('text-gray-500');
                loadSongs();
            } else {
                songsSec.classList.add('hidden');
                usersSec.classList.remove('hidden');
                tabUsers.classList.add('tab-active');
                tabUsers.classList.remove('text-gray-500');
                tabSongs.classList.remove('tab-active');
                tabSongs.classList.add('text-gray-500');
                loadUsers();
            }
        }

        async function loadSongs() {
            const list = document.getElementById('songList');
            const loading = document.getElementById('loading');
            list.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const res = await fetch(`${API_BASE_URL}/api/admin/songs`);
                const songs = await res.json();
                document.getElementById('totalSongs').textContent = songs.length;
                
                if (songs.length === 0) {
                    list.innerHTML = '<tr><td colspan="3" class="px-6 py-10 text-center text-gray-500 text-xs font-bold uppercase tracking-widest">No songs cached in MongoDB</td></tr>';
                } else {
                    list.innerHTML = songs.map(song => `
                        <tr class="hover:bg-white/5 transition-colors">
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-orange-500/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                        <i class="fas fa-music text-orange-500"></i>
                                    </div>
                                    <div class="overflow-hidden">
                                        <p class="font-bold text-sm truncate">${song.title}</p>
                                        <p class="text-[10px] text-gray-500 uppercase font-bold truncate">${song.artist}</p>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-xs text-gray-500 font-bold">
                                ${new Date(song.cachedAt).toLocaleString()}
                            </td>
                            <td class="px-6 py-4 text-right">
                                <button onclick="deleteSong('${song._id}')" class="text-red-500 hover:text-red-400 p-2 transition-colors">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                list.innerHTML = '<tr><td colspan="3" class="px-6 py-10 text-center text-red-500 text-xs font-bold uppercase">Failed to load songs</td></tr>';
            } finally {
                loading.classList.add('hidden');
            }
        }

        async function loadUsers() {
            const list = document.getElementById('userList');
            const loading = document.getElementById('loading');
            list.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const res = await fetch(`${API_BASE_URL}/api/admin/users`);
                const users = await res.json();
                
                list.innerHTML = users.map(user => {
                    const statusClass = user.status === 'free' ? 'text-gray-500' : 'text-orange-500';
                    const expiry = user.expiresAt ? new Date(user.expiresAt).toLocaleDateString() : 'N/A';
                    return `
                        <tr class="hover:bg-white/5 transition-colors">
                            <td class="px-6 py-4">
                                <p class="font-bold text-sm">${user.email || 'No Email'}</p>
                                <p class="text-[9px] text-gray-600 font-mono">${user.uid}</p>
                            </td>
                            <td class="px-6 py-4">
                                <span class="text-[10px] font-black uppercase tracking-widest ${statusClass}">${user.status}</span>
                            </td>
                            <td class="px-6 py-4 text-[10px] font-bold text-gray-500">
                                S: ${user.dailySearches}/5 | P: ${user.dailyPlays}/5
                            </td>
                            <td class="px-6 py-4 text-xs text-gray-500 font-bold">
                                ${expiry}
                            </td>
                            <td class="px-6 py-4 text-right">
                                <button onclick="openStatusModal('${user.uid}', '${user.status}')" class="text-orange-500 hover:text-orange-400 p-2 transition-colors">
                                    <i class="fas fa-user-edit"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                list.innerHTML = '<tr><td colspan="5" class="px-6 py-10 text-center text-red-500 text-xs font-bold uppercase">Failed to load users</td></tr>';
            } finally {
                loading.classList.add('hidden');
            }
        }

        function openStatusModal(uid, currentStatus) {
            document.getElementById('targetUid').value = uid;
            document.getElementById('newStatus').value = currentStatus;
            document.getElementById('statusModal').classList.remove('hidden');
        }

        function closeStatusModal() {
            document.getElementById('statusModal').classList.add('hidden');
        }

        async function updateUserStatus() {
            const uid = document.getElementById('targetUid').value;
            const status = document.getElementById('newStatus').value;
            let days = parseInt(document.getElementById('customDays').value);

            if (!days) {
                if (status === 'starter') days = 3;
                else if (status === 'popular') days = 7;
                else if (status === 'premium') days = 30;
            }

            try {
                const res = await fetch(`${API_BASE_URL}/api/admin/users/update-status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid, status, days })
                });
                const data = await res.json();
                if (data.success) {
                    closeStatusModal();
                    loadUsers();
                }
            } catch (e) {
                alert('Update failed');
            }
        }

        async function deleteSong(id) {
            if (!confirm('Are you sure you want to delete this cached MP3?')) return;
            try {
                const res = await fetch(`${API_BASE_URL}/api/admin/songs/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) loadSongs();
            } catch (e) {
                alert('Delete failed');
            }
        }

        checkAuth();
    </script>
</body>
</html>
