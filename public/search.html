<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Jay SoundCloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f0f0f; color: #ffffff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sc-orange { color: #ff5500; }
        .sc-bg-orange { background-color: #ff5500; }
        .track-card:hover { background: rgba(255, 255, 255, 0.07); transform: translateY(-2px); }
    </style>
</head>
<body class="min-h-screen pb-32">
    <div class="max-w-5xl mx-auto p-6 md:p-10">
        <header class="flex justify-between items-center mb-12">
            <a href="index.html" class="flex items-center gap-3">
                <i class="fab fa-soundcloud text-4xl sc-orange"></i>
                <span class="text-xl font-black tracking-tighter">JAY MUSIC</span>
            </a>
            <nav class="flex gap-6 text-xs font-bold uppercase tracking-widest text-gray-500">
                <a href="index.html" class="hover:text-white transition-colors">Home</a>
                <a href="search.html" class="text-white">Search</a>
                <a href="library.html" class="hover:text-white transition-colors">Library</a>
                <a href="playlist.html" class="hover:text-white transition-colors">Playlists</a>
            </nav>
        </header>

        <div class="max-w-2xl mx-auto mb-16">
            <h2 class="text-5xl font-black mb-8 tracking-tighter text-center uppercase">Explore <span class="sc-orange">Music</span></h2>
            <div class="glass p-2 rounded-2xl flex gap-2 shadow-2xl">
                <input type="text" id="searchInput" placeholder="Search for tracks or artists..." class="flex-1 bg-transparent border-none px-6 py-4 focus:outline-none text-lg font-medium">
                <button onclick="searchSongs()" id="searchBtn" class="sc-bg-orange hover:bg-orange-600 text-white font-black px-10 rounded-xl transition-all active:scale-95">SEARCH</button>
            </div>
        </div>

        <div id="loading" class="hidden py-20 text-center">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-orange-500 border-t-transparent mb-4"></div>
            <p class="text-xs font-bold text-gray-500 uppercase tracking-widest">Searching SoundCloud...</p>
        </div>

        <div id="results" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- Global Player Bar -->
    <div id="playerBar" class="fixed bottom-0 left-0 right-0 glass p-4 md:p-6 border-t border-white/5 z-50 transform translate-y-full transition-transform duration-500">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center gap-6">
            <div class="flex items-center gap-4 w-full md:w-1/3">
                <img id="playerThumb" src="" class="w-14 h-14 rounded-xl shadow-2xl bg-gray-800 object-cover">
                <div class="overflow-hidden">
                    <h4 id="playerTitle" class="font-black text-sm truncate"></h4>
                    <p id="playerAuthor" class="text-[10px] text-gray-500 font-bold uppercase truncate"></p>
                </div>
            </div>
            <div class="w-full md:w-2/3 flex items-center gap-4">
                <audio id="audioPlayer" controls class="flex-1 h-10"></audio>
                <button onclick="closePlayer()" class="text-gray-600 hover:text-white"><i class="fas fa-times-circle text-xl"></i></button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        const firebaseConfig = {
  apiKey: "AIzaSyBztF3TJ_2YSkZDNA8XgiQByQ_8NZCl644",
  authDomain: "mp3-and-users.firebaseapp.com",
  projectId: "mp3-and-users",
  storageBucket: "mp3-and-users.firebasestorage.app",
  messagingSenderId: "515605875722",
  appId: "1:515605875722:web:324bfb4a2843d972f8e3f3"
};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const API_BASE_URL = window.location.origin;
        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
            else currentUser = user;
        });

        window.searchSongs = async () => {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsDiv = document.getElementById('results');
            const loading = document.getElementById('loading');
            resultsDiv.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE_URL}/api/search?query=${encodeURIComponent(query)}`);
                const data = await response.json();
                loading.classList.add('hidden');

                if (data.succes && data.result) {
                    resultsDiv.innerHTML = data.result.map(track => `
                        <div class="glass p-5 rounded-2xl track-card group transition-all duration-300">
                            <div class="aspect-square bg-gray-800 rounded-xl mb-4 overflow-hidden relative">
                                <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=400" class="w-full h-full object-cover opacity-40 group-hover:opacity-100 transition-opacity">
                                <button onclick="playTrack('${track.url}')" class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                    <i class="fas fa-play-circle text-6xl text-orange-500 shadow-2xl"></i>
                                </button>
                            </div>
                            <h4 class="font-black text-lg truncate mb-1">${track.title}</h4>
                            <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest truncate">SoundCloud</p>
                            <button onclick="addToPlaylist('${track.url}', '${track.title.replace(/'/g, "\\'")}')" class="mt-4 text-[10px] font-bold text-gray-500 hover:text-white uppercase tracking-widest"><i class="fas fa-plus mr-2"></i> Add to Playlist</button>
                        </div>
                    `).join('');
                }
            } catch (err) {
                loading.classList.add('hidden');
            }
        };

        window.playTrack = async (url) => {
            const playerBar = document.getElementById('playerBar');
            const audioPlayer = document.getElementById('audioPlayer');
            try {
                const response = await fetch(`${API_BASE_URL}/api/download?link=${encodeURIComponent(url)}`);
                const data = await response.json();
                if (data.success && data.result) {
                    const track = data.result;
                    document.getElementById('playerThumb').src = track.thumbnail || 'https://via.placeholder.com/150';
                    document.getElementById('playerTitle').innerText = track.title;
                    document.getElementById('playerAuthor').innerText = track.author || 'Jay SoundCloud';
                    audioPlayer.src = track.downloadUrl;
                    playerBar.classList.remove('translate-y-full');
                    audioPlayer.play();
                    
                    // Save to history on server
                    const idToken = await currentUser.getIdToken();
                    fetch(`${API_BASE_URL}/api/user/recentlyPlayed`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
                        body: JSON.stringify(track)
                    });
                }
            } catch (err) {}
        };

        window.closePlayer = () => {
            document.getElementById('playerBar').classList.add('translate-y-full');
            document.getElementById('audioPlayer').pause();
        };

        window.addToPlaylist = (url, title) => {
            const playlistId = prompt("Enter Playlist ID or Name (Feature in progress)");
            // Logic to call /api/user/playlists/add-song would go here
        };

        document.getElementById('searchInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') searchSongs(); });
    </script>
</body>
</html>
