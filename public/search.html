<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Search - Jay SoundCloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f0f0f; color: #ffffff; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sc-orange { color: #ff5500; }
        .sc-bg-orange { background-color: #ff5500; }
        .track-card:hover { background: rgba(255, 255, 255, 0.07); transform: translateY(-2px); }
        .modal-overlay { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); }
        
        .mobile-nav { display: none; }
        @media (max-width: 768px) {
            .desktop-nav { display: none !important; }
            .mobile-nav { display: flex; }
        }
        
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .touch-target { min-height: 44px; min-width: 44px; }
        
        /* Toast */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 200; padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 700; }
        
        /* Spinner */
        .spinner { border: 3px solid rgba(255, 85, 0, 0.2); border-top: 3px solid #ff5500; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-24 md:pb-32">
    <!-- Mobile Header -->
    <div class="mobile-nav fixed top-0 left-0 right-0 z-40 glass border-b border-white/5 px-4 py-3">
        <div class="flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <i class="fab fa-soundcloud text-2xl sc-orange"></i>
                <span class="text-sm font-black tracking-tighter">JAY MUSIC</span>
            </a>
            <button onclick="toggleMobileMenu()" class="touch-target flex items-center justify-center w-10 h-10 rounded-lg bg-white/5">
                <i class="fas fa-bars text-lg"></i>
            </button>
        </div>
        <div id="mobileMenu" class="hidden absolute top-full left-0 right-0 glass border-b border-white/5 mt-1 rounded-b-2xl overflow-hidden">
            <div class="flex flex-col p-4 gap-3">
                <a href="index.html" class="text-sm font-bold py-2 px-4 rounded-lg hover:bg-white/5 transition-colors">Home</a>
                <a href="search.html" class="text-sm font-bold py-2 px-4 rounded-lg bg-white/10 text-white">Search</a>
                <a href="library.html" class="text-sm font-bold py-2 px-4 rounded-lg hover:bg-white/5 transition-colors">Library</a>
                <a href="playlist.html" class="text-sm font-bold py-2 px-4 rounded-lg hover:bg-white/5 transition-colors">Playlists</a>
            </div>
        </div>
    </div>
    
    <div class="max-w-5xl mx-auto p-6 md:p-10 pt-20 md:pt-10">
        <header class="desktop-nav flex justify-between items-center mb-8 md:mb-12">
            <a href="index.html" class="flex items-center gap-3">
                <i class="fab fa-soundcloud text-4xl sc-orange"></i>
                <span class="text-xl font-black tracking-tighter">JAY MUSIC</span>
            </a>
            <nav class="flex gap-6 text-xs font-bold uppercase tracking-widest text-gray-500">
                <a href="index.html" class="hover:text-white transition-colors">Home</a>
                <a href="search.html" class="text-white">Search</a>
                <a href="library.html" class="hover:text-white transition-colors">Library</a>
                <a href="playlist.html" class="hover:text-white transition-colors">Playlists</a>
            </nav>
        </header>

        <div class="max-w-2xl mx-auto mb-12 md:mb-16">
            <h2 class="text-3xl sm:text-5xl font-black mb-6 md:mb-8 tracking-tighter text-center uppercase">Explore <span class="sc-orange">Music</span></h2>
            <div class="glass p-2 rounded-2xl flex gap-2 shadow-2xl">
                <input type="text" id="searchInput" placeholder="Search for tracks or artists..." 
                    class="flex-1 bg-transparent border-none px-4 md:px-6 py-3 md:py-4 focus:outline-none text-sm md:text-lg font-medium min-w-0">
                <button onclick="searchSongs()" id="searchBtn" class="touch-target sc-bg-orange hover:bg-orange-600 text-white font-black px-6 md:px-10 rounded-xl transition-all active:scale-95 text-xs md:text-sm flex-shrink-0">
                    <i class="fas fa-search mr-1 md:mr-2"></i>SEARCH
                </button>
            </div>
        </div>

        <div id="loading" class="hidden py-20 text-center">
            <div class="inline-block animate-spin rounded-full h-10 w-10 md:h-12 md:w-12 border-4 border-orange-500 border-t-transparent mb-4"></div>
            <p class="text-xs font-bold text-gray-500 uppercase tracking-widest">Searching SoundCloud...</p>
        </div>

        <div id="results" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6"></div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <!-- Playlist Modal -->
    <div id="playlistModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 modal-overlay">
        <div class="glass p-6 md:p-8 rounded-3xl w-full max-w-sm border border-white/10 shadow-2xl fade-in">
            <h3 class="text-xl md:text-2xl font-black mb-6 tracking-tight">Add to Playlist</h3>
            <div id="playlistOptions" class="space-y-2 md:space-y-3 max-h-48 md:max-h-60 overflow-y-auto mb-4 md:mb-6 pr-2">
                <!-- Playlists will be listed here -->
            </div>
            <div id="modalActions" class="flex gap-3">
                <button onclick="closePlaylistModal()" class="flex-1 touch-target bg-white/5 hover:bg-white/10 text-white font-bold py-3 rounded-xl transition-all text-sm">CANCEL</button>
                <button onclick="showNewPlaylistInput()" class="flex-1 touch-target sc-bg-orange text-white font-bold py-3 rounded-xl transition-all text-sm">NEW PLAYLIST</button>
            </div>
            <!-- Inline new playlist input (replaces prompt) -->
            <div id="newPlaylistInput" class="hidden mt-4 pt-4 border-t border-white/10">
                <input type="text" id="newPlaylistName" placeholder="Playlist name..." 
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 mb-3 focus:outline-none transition-all text-sm font-medium">
                <button onclick="createPlaylistAndAdd()" id="createAndAddBtn" class="touch-target w-full sc-bg-orange text-white font-bold py-3 rounded-xl transition-all text-sm flex items-center justify-center">
                    <span id="createAndAddBtnText">CREATE & ADD</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Global Player Bar -->
    <div id="playerBar" class="fixed bottom-0 left-0 right-0 glass p-3 md:p-6 border-t border-white/5 z-50 transform translate-y-full transition-transform duration-500">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center gap-4 md:gap-6">
            <div class="flex items-center gap-3 md:gap-4 w-full md:w-1/3">
                <img id="playerThumb" src="" class="w-12 h-12 md:w-14 md:h-14 rounded-xl shadow-2xl bg-gray-800 object-cover flex-shrink-0">
                <div class="overflow-hidden">
                    <h4 id="playerTitle" class="font-black text-xs md:text-sm truncate"></h4>
                    <p id="playerAuthor" class="text-[9px] md:text-[10px] text-gray-500 font-bold uppercase truncate"></p>
                </div>
            </div>
            <div class="w-full md:w-2/3 flex items-center gap-3 md:gap-4">
                <audio id="audioPlayer" controls class="flex-1 h-9 md:h-10 w-full"></audio>
                <button onclick="closePlayer()" class="touch-target text-gray-600 hover:text-white flex-shrink-0"><i class="fas fa-times-circle text-lg md:text-xl"></i></button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBztF3TJ_2YSkZDNA8XgiQByQ_8NZCl644",
            authDomain: "mp3-and-users.firebaseapp.com",
            projectId: "mp3-and-users",
            storageBucket: "mp3-and-users.firebasestorage.app",
            messagingSenderId: "515605875722",
            appId: "1:515605875722:web:324bfb4a2843d972f8e3f3"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const API_BASE_URL = window.location.origin;
        let currentUser = null;
        let selectedSong = null;

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast fade-in ${isError ? 'bg-red-500/20 text-red-300 border border-red-500/30' : 'bg-green-500/20 text-green-300 border border-green-500/30'}`;
            setTimeout(() => { toast.classList.add('hidden'); }, 2500);
        }

        function setAddLoading(loading) {
            const btnText = document.getElementById('createAndAddBtnText');
            if (loading) {
                btnText.innerHTML = '<div class="spinner mr-2"></div> Adding...';
            } else {
                btnText.textContent = 'CREATE & ADD';
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
            else currentUser = user;
        });

        window.searchSongs = async () => {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsDiv = document.getElementById('results');
            const loading = document.getElementById('loading');
            resultsDiv.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE_URL}/api/search?query=${encodeURIComponent(query)}`);
                const data = await response.json();
                loading.classList.add('hidden');

                if ((data.succes || data.success) && data.result) {
                    resultsDiv.innerHTML = data.result.map(track => `
                        <div class="glass p-4 md:p-5 rounded-2xl track-card group transition-all duration-300 fade-in">
                            <div class="aspect-square bg-gray-800 rounded-xl mb-3 md:mb-4 overflow-hidden relative">
                                <img src="${track.thumbnail || 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=400'}" class="w-full h-full object-cover opacity-40 group-hover:opacity-100 transition-opacity">
                                <button onclick="playTrack('${track.url}')" class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                    <i class="fas fa-play-circle text-4xl md:text-6xl text-orange-500 shadow-2xl"></i>
                                </button>
                            </div>
                            <h4 class="font-black text-sm md:text-lg truncate mb-1">${track.title}</h4>
                            <p class="text-[9px] md:text-[10px] text-gray-500 font-bold uppercase tracking-widest truncate">${track.author || 'SoundCloud'}</p>
                            <button onclick="openPlaylistModal(${JSON.stringify(track).replace(/'/g, "&#39;")})" 
                                class="touch-target mt-3 md:mt-4 w-full flex items-center justify-center gap-2 text-[10px] md:text-xs font-bold text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 py-2 rounded-lg transition-all">
                                <i class="fas fa-plus"></i> Add to Playlist
                            </button>
                        </div>
                    `).join('');
                } else {
                    resultsDiv.innerHTML = '<p class="text-gray-700 font-bold uppercase tracking-widest text-xs py-20 text-center col-span-full">No results found.</p>';
                }
            } catch (err) {
                loading.classList.add('hidden');
                console.error("Search error:", err);
                showToast('Search failed. Please try again.', true);
            }
        };

        window.playTrack = async (url) => {
            if (!url) return;
            const playerBar = document.getElementById('playerBar');
            const audioPlayer = document.getElementById('audioPlayer');
            try {
                const response = await fetch(`${API_BASE_URL}/api/download?link=${encodeURIComponent(url)}`);
                const data = await response.json();
                if (data.success && data.result) {
                    const track = data.result;
                    document.getElementById('playerThumb').src = track.thumbnail || 'https://via.placeholder.com/150';
                    document.getElementById('playerTitle').innerText = track.title;
                    document.getElementById('playerAuthor').innerText = track.author || 'Jay SoundCloud';
                    audioPlayer.src = track.downloadUrl;
                    playerBar.classList.remove('translate-y-full');
                    audioPlayer.play();
                    
                    // Save to history (fire and forget)
                    try {
                        const idToken = await currentUser.getIdToken();
                        fetch(`${API_BASE_URL}/api/user/recentlyPlayed`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
                            body: JSON.stringify(track)
                        }).catch(() => {});
                    } catch(e) {}
                }
            } catch (err) {
                console.error("Play error:", err);
            }
        };

        window.closePlayer = () => {
            document.getElementById('playerBar').classList.add('translate-y-full');
            document.getElementById('audioPlayer').pause();
        };

        // --- Playlist Logic (FIXED - uses Realtime DB backend) ---
        
        window.openPlaylistModal = async (track) => {
            selectedSong = track;
            const modal = document.getElementById('playlistModal');
            const options = document.getElementById('playlistOptions');
            const newPlaylistSection = document.getElementById('newPlaylistInput');
            const modalActions = document.getElementById('modalActions');
            newPlaylistSection.classList.add('hidden');
            modalActions.classList.remove('hidden');
            options.innerHTML = '<div class="flex items-center justify-center py-6"><div class="spinner mr-2"></div><span class="text-xs text-gray-500 font-bold uppercase">Loading playlists...</span></div>';
            modal.classList.remove('hidden');

            try {
                const idToken = await currentUser.getIdToken();
                const response = await fetch(`${API_BASE_URL}/api/user/playlists`, {
                    headers: { 'Authorization': `Bearer ${idToken}` }
                });
                
                if (!response.ok) throw new Error('Failed to fetch playlists');
                
                const playlists = await response.json();

                if (playlists.length > 0) {
                    options.innerHTML = playlists.map(pl => `
                        <button onclick="addSongToPlaylist('${pl.id}')" 
                            class="touch-target w-full text-left glass p-3 md:p-4 rounded-xl hover:bg-white/10 transition-all font-bold text-xs md:text-sm flex items-center justify-between">
                            <span class="truncate">${pl.name}</span>
                            <span class="text-gray-600 text-[10px]">${pl.songCount || 0} songs</span>
                        </button>
                    `).join('');
                } else {
                    options.innerHTML = '<p class="text-xs text-gray-500 font-bold uppercase py-4 text-center">No playlists yet. Create one!</p>';
                }
            } catch (error) {
                console.error("Load playlists for modal error:", error);
                options.innerHTML = '<p class="text-xs text-red-400 font-bold uppercase py-4 text-center">Failed to load playlists</p>';
            }
        };

        window.closePlaylistModal = () => {
            document.getElementById('playlistModal').classList.add('hidden');
            document.getElementById('newPlaylistInput').classList.add('hidden');
            document.getElementById('modalActions').classList.remove('hidden');
            document.getElementById('newPlaylistName').value = '';
            setAddLoading(false);
            selectedSong = null;
        };

        window.showNewPlaylistInput = () => {
            document.getElementById('newPlaylistInput').classList.remove('hidden');
            document.getElementById('modalActions').classList.add('hidden');
            document.getElementById('playlistOptions').classList.add('hidden');
            setTimeout(() => document.getElementById('newPlaylistName').focus(), 100);
        };

        // Add song to an EXISTING playlist
        window.addSongToPlaylist = async (playlistId) => {
            if (!selectedSong) {
                showToast('No song selected', true);
                return;
            }
            
            try {
                const idToken = await currentUser.getIdToken();
                const response = await fetch(`${API_BASE_URL}/api/user/playlists/add-song`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${idToken}` 
                    },
                    body: JSON.stringify({ 
                        playlistId, 
                        song: {
                            songId: selectedSong.url || Date.now().toString(),
                            title: selectedSong.title,
                            artist: selectedSong.author || '',
                            artwork: selectedSong.thumbnail || '',
                            streamUrl: selectedSong.url || ''
                        }
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Failed to add song');
                }
                
                showToast('Song added to playlist!');
                closePlaylistModal();
            } catch (error) {
                console.error("Add song error:", error);
                showToast('Failed to add song: ' + error.message, true);
            }
        };

        // Create NEW playlist and add song in ONE fast request
        window.createPlaylistAndAdd = async () => {
            const name = document.getElementById('newPlaylistName').value.trim();
            if (!name) {
                showToast('Please enter a playlist name', true);
                return;
            }
            
            if (!selectedSong) {
                showToast('No song selected', true);
                return;
            }

            setAddLoading(true);

            try {
                const idToken = await currentUser.getIdToken();
                
                // Single API call: create playlist + add song
                const response = await fetch(`${API_BASE_URL}/api/user/playlists/create-and-add`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${idToken}` 
                    },
                    body: JSON.stringify({ 
                        name,
                        song: {
                            songId: selectedSong.url || Date.now().toString(),
                            title: selectedSong.title,
                            artist: selectedSong.author || '',
                            artwork: selectedSong.thumbnail || '',
                            streamUrl: selectedSong.url || ''
                        }
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Failed to create playlist and add song');
                }
                
                showToast('Playlist created and song added!');
                closePlaylistModal();
            } catch (error) {
                console.error("Create and add error:", error);
                showToast('Error: ' + error.message, true);
            }
        };

        // Handle Enter key in new playlist input
        document.getElementById('newPlaylistName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') createPlaylistAndAdd();
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') searchSongs(); 
        });

        window.toggleMobileMenu = () => {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        };

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('mobileMenu');
            if (!e.target.closest('.mobile-nav') && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
