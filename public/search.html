<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Search - Jay SoundCloud</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ff5500">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jay Music">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f0f0f; color: #ffffff; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sc-orange { color: #ff5500; }
        .sc-bg-orange { background-color: #ff5500; }
        .track-card:hover { background: rgba(255, 255, 255, 0.07); transform: translateY(-2px); }
        .modal-overlay { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); }
        
        .mobile-nav { display: none; }
        @media (max-width: 768px) {
            .desktop-nav { display: none !important; }
            .mobile-nav { display: flex; }
        }
        
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .touch-target { min-height: 44px; min-width: 44px; }
        
        /* Toast */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 200; padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 700; }
        
        /* Spinner */
        .spinner { border: 3px solid rgba(255, 85, 0, 0.2); border-top: 3px solid #ff5500; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-24 md:pb-32">
    <!-- Mobile Header -->
    <div class="mobile-nav fixed top-0 left-0 right-0 z-40 glass border-b border-white/5 px-4 py-3">
        <div class="flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <i class="fab fa-soundcloud text-2xl sc-orange"></i>
                <span class="text-sm font-black tracking-tighter">JAY MUSIC</span>
            </a>
            <button onclick="toggleMobileMenu()" class="touch-target flex items-center justify-center w-10 h-10 rounded-lg bg-white/5">
                <i class="fas fa-bars text-lg"></i>
            </button>
        </div>
        <div id="mobileMenu" class="hidden absolute top-full left-0 right-0 glass border-b border-white/5 mt-1 rounded-b-2xl overflow-hidden">
            <div class="flex flex-col p-4 gap-3">
                <a href="index.html" class="text-sm font-bold py-2 px-4 rounded-lg hover:bg-white/5 transition-colors">Home</a>
                <a href="search.html" class="text-sm font-bold py-2 px-4 rounded-lg bg-white/10 text-white">Search</a>
                <a href="library.html" class="text-sm font-bold py-2 px-4 rounded-lg hover:bg-white/5 transition-colors">Library</a>
                <a href="playlist.html" class="text-sm font-bold py-2 px-4 rounded-lg hover:bg-white/5 transition-colors">Playlists</a>
            </div>
        </div>
    </div>
    
    <div class="max-w-5xl mx-auto p-6 md:p-10 pt-20 md:pt-10">
        <header class="desktop-nav flex justify-between items-center mb-8 md:mb-12">
            <a href="index.html" class="flex items-center gap-3">
                <i class="fab fa-soundcloud text-4xl sc-orange"></i>
                <span class="text-xl font-black tracking-tighter">JAY MUSIC</span>
            </a>
            <nav class="flex gap-6 text-xs font-bold uppercase tracking-widest text-gray-500">
                <a href="index.html" class="hover:text-white transition-colors">Home</a>
                <a href="search.html" class="text-white">Search</a>
                <a href="library.html" class="hover:text-white transition-colors">Library</a>
                <a href="playlist.html" class="hover:text-white transition-colors">Playlists</a>
            </nav>
        </header>

        <div class="max-w-2xl mx-auto mb-12 md:mb-16">
            <h2 class="text-3xl sm:text-5xl font-black mb-6 md:mb-8 tracking-tighter text-center uppercase">Explore <span class="sc-orange">Music</span></h2>
            <div id="usageLimitInfo" class="hidden mb-4 p-4 glass rounded-2xl border-orange-500/30 text-center">
                <p class="text-[10px] font-bold text-orange-500 uppercase tracking-widest">Free Plan: <span id="usageStats"></span></p>
            </div>
            <div class="glass p-2 rounded-2xl flex gap-2 shadow-2xl">
                <input type="text" id="searchInput" placeholder="Search for tracks or artists..." 
                    class="flex-1 bg-transparent border-none px-4 md:px-6 py-3 md:py-4 focus:outline-none text-sm md:text-lg font-medium min-w-0">
                <button onclick="searchSongs()" id="searchBtn" class="touch-target sc-bg-orange hover:bg-orange-600 text-white font-black px-6 md:px-10 rounded-xl transition-all active:scale-95 text-xs md:text-sm flex-shrink-0">
                    <i class="fas fa-search mr-1 md:mr-2"></i>SEARCH
                </button>
            </div>
        </div>

        <div id="loading" class="hidden py-20 text-center">
            <div class="inline-block animate-spin rounded-full h-10 w-10 md:h-12 md:w-12 border-4 border-orange-500 border-t-transparent mb-4"></div>
            <p class="text-xs font-bold text-gray-500 uppercase tracking-widest">Searching SoundCloud...</p>
        </div>

        <div id="results" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6"></div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <!-- Playlist Modal -->
    <div id="playlistModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 modal-overlay">
        <div class="glass p-6 md:p-8 rounded-3xl w-full max-w-sm border border-white/10 shadow-2xl fade-in">
            <h3 class="text-xl md:text-2xl font-black mb-4 tracking-tight">Add to Playlist</h3>
            <p id="selectedSongInfo" class="text-xs text-gray-400 mb-4 truncate font-bold">No song selected</p>
            
            <!-- VIEW 1: Choose existing playlist or create new -->
            <div id="viewChoosePlaylist">
                <div id="playlistOptions" class="space-y-2 md:space-y-3 max-h-48 md:max-h-60 overflow-y-auto mb-4 md:mb-6 pr-2">
                </div>
                <div id="modalActions" class="flex gap-3">
                    <button onclick="closePlaylistModal()" class="flex-1 touch-target bg-white/5 hover:bg-white/10 text-white font-bold py-3 rounded-xl transition-all text-sm">CANCEL</button>
                    <button onclick="showNewPlaylistInput()" class="flex-1 touch-target sc-bg-orange text-white font-bold py-3 rounded-xl transition-all text-sm">NEW PLAYLIST</button>
                </div>
            </div>
            
            <!-- VIEW 2: Create new playlist input -->
            <div id="viewNewPlaylist" class="hidden">
                <button onclick="showChooseView()" class="text-xs text-gray-400 hover:text-white mb-3 flex items-center gap-1">
                    <i class="fas fa-chevron-left"></i> Back
                </button>
                <input type="text" id="newPlaylistName" placeholder="Enter playlist name..." 
                    class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 mb-3 focus:outline-none transition-all text-sm font-medium"
                    onkeypress="if(event.key==='Enter') createPlaylistAndAdd()">
                <button onclick="createPlaylistAndAdd()" id="createAndAddBtn" class="touch-target w-full sc-bg-orange text-white font-bold py-3 rounded-xl transition-all text-sm flex items-center justify-center">
                    <span id="createAndAddBtnText">CREATE & ADD SONG</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Global Player Bar -->
    <div id="playerBar" class="fixed bottom-0 left-0 right-0 glass p-3 md:p-6 border-t border-white/5 z-50 transform translate-y-full transition-transform duration-500">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center gap-4 md:gap-6">
            <div class="flex items-center gap-3 md:gap-4 w-full md:w-1/3">
                <img id="playerThumb" src="" class="w-12 h-12 md:w-14 md:h-14 rounded-xl shadow-2xl bg-gray-800 object-cover flex-shrink-0">
                <div class="overflow-hidden">
                    <h4 id="playerTitle" class="font-black text-xs md:text-sm truncate"></h4>
                    <p id="playerAuthor" class="text-[9px] md:text-[10px] text-gray-500 font-bold uppercase truncate"></p>
                </div>
            </div>
            <div class="w-full md:w-2/3 flex items-center gap-3 md:gap-4">
                <audio id="audioPlayer" controls class="flex-1 h-9 md:h-10 w-full"></audio>
                <button onclick="closePlayer()" class="touch-target text-gray-600 hover:text-white flex-shrink-0"><i class="fas fa-times-circle text-lg md:text-xl"></i></button>
            </div>
        </div>
    </div>

    <!-- Upgrade Modal -->
    <div id="upgradeModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[110] hidden flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[40px] w-full max-w-sm text-center fade-in border border-white/10">
            <div class="w-20 h-20 sc-bg-orange rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-orange-500/20">
                <i class="fas fa-crown text-3xl text-white"></i>
            </div>
            <h3 class="text-2xl font-black mb-2 uppercase tracking-tighter">Limit <span class="sc-orange">Reached</span></h3>
            <p id="limitMessage" class="text-gray-400 text-xs font-bold uppercase tracking-widest mb-8 leading-relaxed"></p>
            
            <div class="space-y-3">
                <a href="index.html#pricing" class="w-full sc-bg-orange text-white font-black py-4 rounded-2xl hover:bg-orange-600 transition-all flex items-center justify-center gap-2 shadow-xl shadow-orange-500/20">
                    VIEW PRICING PLANS
                </a>
                <button onclick="closeUpgradeModal()" class="w-full bg-white/5 text-gray-500 font-bold py-3 rounded-2xl hover:text-white transition-all text-xs uppercase">Close</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBztF3TJ_2YSkZDNA8XgiQByQ_8NZCl644",
            authDomain: "mp3-and-users.firebaseapp.com",
            projectId: "mp3-and-users",
            storageBucket: "mp3-and-users.firebasestorage.app",
            messagingSenderId: "515605875722",
            appId: "1:515605875722:web:324bfb4a2843d972f8e3f3"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const API_BASE_URL = window.location.origin;
        
        // Auth state
        let currentUser = null;
        
        // Track storage - use index-based lookup instead of embedding JSON in HTML
        let searchResults = []; // Stores all search result tracks
        let selectedTrackIndex = null; // Index of the track we're adding to playlist

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                currentUser = user;
            }
        });

        // Toast notification
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast fade-in ${isError ? 'bg-red-500/20 text-red-300 border border-red-500/30' : 'bg-green-500/20 text-green-300 border border-green-500/30'}`;
            setTimeout(() => { toast.classList.add('hidden'); }, 3000);
        }

        // --- SEARCH ---
        window.searchSongs = async () => {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsDiv = document.getElementById('results');
            const loading = document.getElementById('loading');
            resultsDiv.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const idToken = await currentUser.getIdToken();
                const response = await fetch(`${API_BASE_URL}/api/search?query=${encodeURIComponent(query)}`, {
                    headers: { 'Authorization': `Bearer ${idToken}` }
                });
                
                if (response.status === 403) {
                    loading.classList.add('hidden');
                    showUpgradeModal("You've reached your 5 daily searches limit.");
                    return;
                }

                const data = await response.json();
                loading.classList.add('hidden');

                if ((data.succes || data.success) && data.result && Array.isArray(data.result)) {
                    // Store tracks in global array (NO JSON in HTML!)
                    searchResults = data.result;
                    
                    resultsDiv.innerHTML = data.result.map((track, index) => `
                        <div class="glass p-4 md:p-5 rounded-2xl track-card group transition-all duration-300 fade-in">
                            <div class="aspect-square bg-gray-800 rounded-xl mb-3 md:mb-4 overflow-hidden relative">
                                <img src="${track.thumbnail || 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=400'}" class="w-full h-full object-cover opacity-40 group-hover:opacity-100 transition-opacity" loading="lazy">
                                <button onclick="playTrackByIndex(${index})" class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                    <i class="fas fa-play-circle text-4xl md:text-6xl text-orange-500 shadow-2xl"></i>
                                </button>
                            </div>
                            <h4 class="font-black text-sm md:text-lg truncate mb-1">${track.title || 'Unknown'}</h4>
                            <p class="text-[9px] md:text-[10px] text-gray-500 font-bold uppercase tracking-widest truncate">${track.author || 'SoundCloud'}</p>
                            <button onclick="openPlaylistModalForTrack(${index})" 
                                class="touch-target mt-3 md:mt-4 w-full flex items-center justify-center gap-2 text-[10px] md:text-xs font-bold text-orange-400 hover:text-orange-300 bg-orange-500/10 hover:bg-orange-500/20 py-2.5 rounded-lg transition-all border border-orange-500/20">
                                <i class="fas fa-plus"></i> Add to Playlist
                            </button>
                        </div>
                    `).join('');
                } else {
                    resultsDiv.innerHTML = '<p class="text-gray-700 font-bold uppercase tracking-widest text-xs py-20 text-center col-span-full">No results found.</p>';
                }
            } catch (err) {
                loading.classList.add('hidden');
                console.error("Search error:", err);
                showToast('Search failed. Please try again.', true);
            }
        };

        // Play a track by its index in searchResults
        window.playTrackByIndex = async (index) => {
            const track = searchResults[index];
            if (!track || !track.url) return;
            
            const playerBar = document.getElementById('playerBar');
            const audioPlayer = document.getElementById('audioPlayer');
            try {
                const idToken = await currentUser.getIdToken();
                const response = await fetch(`${API_BASE_URL}/api/download?link=${encodeURIComponent(track.url)}&title=${encodeURIComponent(track.title)}&artist=${encodeURIComponent(track.author)}`, {
                    headers: { 'Authorization': `Bearer ${idToken}` }
                });
                
                if (response.status === 403) {
                    showUpgradeModal("You've reached your 5 daily plays limit.");
                    return;
                }

                const data = await response.json();
                if (data.success && data.result) {
                    const result = data.result;
                    document.getElementById('playerThumb').src = result.thumbnail || 'https://via.placeholder.com/150';
                    document.getElementById('playerTitle').innerText = result.title;
                    document.getElementById('playerAuthor').innerText = result.author || 'Jay SoundCloud';
                    audioPlayer.src = result.downloadUrl;
                    playerBar.classList.remove('translate-y-full');
                    audioPlayer.play();
                    
                    // Save to recently played (fire and forget)
                    try {
                        const idToken = await currentUser.getIdToken();
                        fetch(`${API_BASE_URL}/api/user/recentlyPlayed`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
                            body: JSON.stringify({
                                title: result.title,
                                url: track.url,
                                thumbnail: track.thumbnail,
                                author: track.author
                            })
                        }).catch(() => {});
                    } catch(e) {}
                }
            } catch (err) {
                console.error("Play error:", err);
                showToast('Failed to play track', true);
            }
        };

        window.closePlayer = () => {
            document.getElementById('playerBar').classList.add('translate-y-full');
            document.getElementById('audioPlayer').pause();
        };

        // --- PLAYLIST MODAL ---
        
        window.openPlaylistModalForTrack = (index) => {
            const track = searchResults[index];
            if (!track) {
                showToast('Song data not found', true);
                return;
            }
            
            selectedTrackIndex = index;
            document.getElementById('selectedSongInfo').textContent = `Adding: ${track.title || 'Unknown'} by ${track.author || 'Unknown'}`;
            document.getElementById('viewChoosePlaylist').classList.remove('hidden');
            document.getElementById('viewNewPlaylist').classList.add('hidden');
            document.getElementById('newPlaylistName').value = '';
            
            const options = document.getElementById('playlistOptions');
            options.innerHTML = '<div class="flex items-center justify-center py-6"><div class="spinner mr-2"></div><span class="text-xs text-gray-500 font-bold uppercase">Loading playlists...</span></div>';
            document.getElementById('playlistModal').classList.remove('hidden');
            
            loadPlaylistsForModal();
        };

        async function loadPlaylistsForModal() {
            const options = document.getElementById('playlistOptions');
            try {
                const idToken = await currentUser.getIdToken();
                const response = await fetch(`${API_BASE_URL}/api/user/playlists?t=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${idToken}` },
                    cache: 'no-store'
                });
                
                if (!response.ok) throw new Error(`Server returned ${response.status}`);
                
                const playlists = await response.json();
                console.log('Playlists loaded for modal:', playlists);
                
                if (playlists.length > 0) {
                    options.innerHTML = playlists.map(pl => `
                        <button onclick="addSongToPlaylist('${pl.id}')" 
                            class="touch-target w-full text-left glass p-3 md:p-4 rounded-xl hover:bg-orange-500/10 transition-all font-bold text-xs md:text-sm flex items-center justify-between border border-transparent hover:border-orange-500/30">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 bg-orange-500/20 rounded-lg flex items-center justify-center flex-shrink-0">
                                    <i class="fas fa-music text-xs text-orange-400"></i>
                                </div>
                                <span class="truncate">${pl.name}</span>
                            </div>
                            <span class="text-gray-600 text-[10px] flex-shrink-0 ml-2">${pl.songCount || 0} songs</span>
                        </button>
                    `).join('');
                } else {
                    options.innerHTML = `
                        <div class="text-center py-6">
                            <i class="fas fa-folder-open text-2xl text-gray-600 mb-3"></i>
                            <p class="text-xs text-gray-500 font-bold uppercase">No playlists yet</p>
                            <p class="text-[10px] text-gray-600 mt-1">Tap "New Playlist" to create one and add this song</p>
                        </div>`;
                }
            } catch (error) {
                console.error("Load playlists for modal error:", error);
                options.innerHTML = `
                    <div class="text-center py-6">
                        <i class="fas fa-exclamation-circle text-2xl text-red-400 mb-3"></i>
                        <p class="text-xs text-red-400 font-bold uppercase">Failed to load playlists</p>
                        <button onclick="loadPlaylistsForModal()" class="mt-3 touch-target bg-white/5 px-4 py-2 rounded-lg text-[10px] font-bold">Retry</button>
                    </div>`;
            }
        }

        window.showNewPlaylistInput = () => {
            document.getElementById('viewChoosePlaylist').classList.add('hidden');
            document.getElementById('viewNewPlaylist').classList.remove('hidden');
            setTimeout(() => document.getElementById('newPlaylistName').focus(), 100);
        };

        window.showChooseView = () => {
            document.getElementById('viewNewPlaylist').classList.add('hidden');
            document.getElementById('viewChoosePlaylist').classList.remove('hidden');
            document.getElementById('newPlaylistName').value = '';
        };

        window.closePlaylistModal = () => {
            document.getElementById('playlistModal').classList.add('hidden');
            document.getElementById('newPlaylistName').value = '';
            setAddLoading(false);
            selectedTrackIndex = null;
        };

        function setAddLoading(loading) {
            const btnText = document.getElementById('createAndAddBtnText');
            if (loading) {
                btnText.innerHTML = '<div class="spinner mr-2"></div> Creating...';
            } else {
                btnText.textContent = 'CREATE & ADD SONG';
            }
        }

        // Add song to an EXISTING playlist
        window.addSongToPlaylist = async (playlistId) => {
            if (selectedTrackIndex === null || !searchResults[selectedTrackIndex]) {
                showToast('No song selected', true);
                return;
            }
            
            const track = searchResults[selectedTrackIndex];
            
            const btn = event.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<div class="spinner mr-2"></div> Adding...';
            btn.disabled = true;
            
            try {
                const idToken = await currentUser.getIdToken();
                const response = await fetch(`${API_BASE_URL}/api/user/playlists/add-song`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${idToken}` 
                    },
                    body: JSON.stringify({ 
                        playlistId: playlistId, 
                        song: {
                            songId: track.url || track.title + '-' + Date.now(),
                            title: track.title || 'Unknown',
                            artist: track.author || '',
                            artwork: track.thumbnail || '',
                            streamUrl: track.url || ''
                        }
                    })
                });
                
                const data = await response.json();
                console.log('Add song response:', data);
                
                if (!response.ok) {
                    throw new Error(data.error || `Server error: ${response.status}`);
                }
                if (!data.success) {
                    throw new Error(data.error || 'Failed to add song');
                }
                
                showToast('Song added to playlist!');
                closePlaylistModal();
            } catch (error) {
                console.error("Add song error:", error);
                btn.innerHTML = originalHTML;
                btn.disabled = false;
                showToast('Failed: ' + error.message, true);
            }
        };

        // Create NEW playlist and add song in ONE request
        window.createPlaylistAndAdd = async () => {
            const name = document.getElementById('newPlaylistName').value.trim();
            if (!name) {
                showToast('Please enter a playlist name', true);
                return;
            }
            
            if (selectedTrackIndex === null || !searchResults[selectedTrackIndex]) {
                showToast('No song selected', true);
                return;
            }

            const track = searchResults[selectedTrackIndex];
            setAddLoading(true);

            try {
                const idToken = await currentUser.getIdToken();
                
                const response = await fetch(`${API_BASE_URL}/api/user/playlists/create-and-add`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${idToken}` 
                    },
                    body: JSON.stringify({ 
                        name: name,
                        song: {
                            songId: track.url || track.title + '-' + Date.now(),
                            title: track.title || 'Unknown',
                            artist: track.author || '',
                            artwork: track.thumbnail || '',
                            streamUrl: track.url || ''
                        }
                    })
                });
                
                const data = await response.json();
                console.log('Create and add response:', data);
                
                if (!response.ok) {
                    throw new Error(data.error || `Server error: ${response.status}`);
                }
                if (!data.success) {
                    throw new Error(data.error || 'Failed to create playlist');
                }
                
                showToast('Playlist created and song added!');
                closePlaylistModal();
            } catch (error) {
                console.error("Create and add error:", error);
                setAddLoading(false);
                showToast('Error: ' + error.message, true);
            }
        };

        // Enter key on search input
        document.getElementById('searchInput').addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') searchSongs(); 
        });

        // Mobile menu
        window.toggleMobileMenu = () => {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        };

        window.showUpgradeModal = (msg) => {
            document.getElementById('limitMessage').textContent = msg;
            document.getElementById('upgradeModal').classList.remove('hidden');
        };

        window.closeUpgradeModal = () => {
            document.getElementById('upgradeModal').classList.add('hidden');
        };

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('mobileMenu');
            if (!e.target.closest('.mobile-nav') && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        });

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/pwabuilder-sw.js')
                    .then(reg => console.log('[Jay Music] SW registered:', reg.scope))
                    .catch(err => console.log('[Jay Music] SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
