<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay Bohol SoundCloud Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #121212;
            color: #ffffff;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sc-orange {
            color: #ff5500;
        }
        .sc-bg-orange {
            background-color: #ff5500;
        }
        .footer-link {
            color: #ff5500;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .footer-link:hover {
            color: #ff7733;
            text-decoration: underline;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col">
    <div class="max-w-4xl mx-auto flex-1 w-full">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold mb-2">
                <i class="fab fa-soundcloud sc-orange"></i> Jay Bohol <span class="text-gray-400">SoundCloud</span>
            </h1>
            <p class="text-gray-400">Search and download your favorite tracks</p>
        </header>

        <!-- Search Bar -->
        <div class="glass p-6 rounded-2xl mb-8">
            <div class="flex flex-col md:flex-row gap-4">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Enter song name or artist..." 
                    class="flex-1 bg-black/40 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 transition-all"
                >
                <button 
                    onclick="searchSongs()" 
                    id="searchBtn"
                    class="sc-bg-orange hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-xl transition-all flex items-center justify-center gap-2"
                >
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="hidden text-center py-10">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-orange-500 border-t-transparent"></div>
            <p class="mt-4 text-gray-400">Fetching tracks...</p>
        </div>

        <!-- Results Section -->
        <div id="results" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Results will be injected here -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-8 mt-8 border-t border-white/10 max-w-4xl mx-auto w-full">
        <p class="text-gray-400 text-sm mb-2">
            Made with <i class="fas fa-heart text-red-500"></i> by <span class="font-bold text-white">Jay Bohol</span>
        </p>
        <p class="text-gray-500 text-sm">
            <i class="fab fa-facebook text-blue-500 mr-1"></i>
            <a href="https://www.facebook.com/profile.php?id=61590490534032" 
               target="_blank" 
               rel="noopener noreferrer"
               class="footer-link">
                Facebook: Jay Bohol
            </a>
        </p>
        <p class="text-gray-600 text-xs mt-2">
            &copy; 2026 Jay Bohol SoundCloud Music. All rights reserved.
        </p>
    </footer>

    <!-- Player Modal (Floating) -->
    <div id="playerContainer" class="fixed bottom-0 left-0 right-0 p-4 bg-black/90 border-t border-white/10 transform translate-y-full transition-transform duration-300 z-50">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center gap-4">
            <div class="flex items-center gap-4 flex-1">
                <img id="playerThumb" src="" alt="" class="w-12 h-12 rounded-lg object-cover">
                <div class="overflow-hidden">
                    <h3 id="playerTitle" class="font-bold truncate"></h3>
                    <p id="playerAuthor" class="text-sm text-gray-400 truncate"></p>
                </div>
            </div>
            <audio id="audioPlayer" controls class="w-full md:w-2/3"></audio>
            <button onclick="closePlayer()" class="text-gray-400 hover:text-white p-2">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
    </div>

    <script>
        // API Configuration - Now using our secure backend
        const API_BASE_URL = window.location.origin;
        const SEARCH_URL = `${API_BASE_URL}/api/search`;
        const DOWNLOAD_URL = `${API_BASE_URL}/api/download`;

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsDiv = document.getElementById('results');
        const loading = document.getElementById('loading');
        const playerContainer = document.getElementById('playerContainer');
        const audioPlayer = document.getElementById('audioPlayer');

        // Handle Enter key
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchSongs();
        });

        async function searchSongs() {
            const query = searchInput.value.trim();
            if (!query) {
                showError('Please enter a search term');
                return;
            }

            // UI Reset
            resultsDiv.innerHTML = '';
            loading.classList.remove('hidden');
            searchBtn.disabled = true;

            try {
                const response = await fetch(`${SEARCH_URL}?query=${encodeURIComponent(query)}`);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Search failed');
                }

                const data = await response.json();

                if (data.success && data.data && data.data.length > 0) {
                    displayResults(data.data);
                } else {
                    resultsDiv.innerHTML = `
                        <div class="col-span-full text-center text-gray-500 py-10">
                            <i class="fas fa-music text-4xl mb-4 block"></i>
                            No results found. Try a different search term.
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Search error:', error);
                showError(error.message || 'Error fetching results. Please try again.');
            } finally {
                loading.classList.add('hidden');
                searchBtn.disabled = false;
            }
        }

        function displayResults(tracks) {
            resultsDiv.innerHTML = tracks.map((track, index) => `
                <div class="glass p-4 rounded-xl flex flex-col justify-between hover:bg-white/10 transition-all group">
                    <div class="mb-4">
                        <h3 class="font-bold text-lg mb-1 line-clamp-2">${escapeHtml(track.title)}</h3>
                        <p class="text-xs text-gray-400 truncate">${escapeHtml(track.author || 'Unknown Artist')}</p>
                        ${track.duration ? `<p class="text-xs text-gray-500 mt-1">${formatDuration(track.duration)}</p>` : ''}
                    </div>
                    <div class="flex gap-2">
                        <button 
                            onclick="getDownloadInfo('${escapeHtml(track.url)}', this)" 
                            class="flex-1 bg-white/10 hover:bg-orange-500 text-white py-2 rounded-lg transition-all flex items-center justify-center gap-2"
                        >
                            <i class="fas fa-play"></i> Play / Get Info
                        </button>
                        <a 
                            href="${escapeHtml(track.url)}" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            class="p-2 bg-white/5 hover:bg-white/20 rounded-lg transition-all"
                            title="Open on SoundCloud"
                        >
                            <i class="fab fa-soundcloud"></i>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        async function getDownloadInfo(link, btn) {
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner animate-spin"></i> Loading...';

            try {
                const response = await fetch(`${DOWNLOAD_URL}?link=${encodeURIComponent(link)}`);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Failed to get track information');
                }

                const data = await response.json();

                if (data.success && data.data) {
                    playTrack(data.data);
                } else {
                    showError('Could not retrieve track details');
                }
            } catch (error) {
                console.error('Download error:', error);
                showError(error.message || 'Error fetching track details');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        function playTrack(track) {
            document.getElementById('playerThumb').src = track.thumbnail || 'https://via.placeholder.com/150';
            document.getElementById('playerTitle').innerText = track.title || 'Unknown Title';
            document.getElementById('playerAuthor').innerText = track.author || 'Unknown Artist';
            
            audioPlayer.src = track.downloadUrl;
            playerContainer.classList.remove('translate-y-full');
            audioPlayer.play().catch(err => {
                console.error('Playback error:', err);
                showError('Unable to play track. Please try again.');
            });
        }

        function closePlayer() {
            playerContainer.classList.add('translate-y-full');
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
        }

        // Helper Functions
        function showError(message) {
            resultsDiv.innerHTML = `
                <div class="col-span-full text-center text-red-400 py-10">
                    <i class="fas fa-exclamation-triangle text-4xl mb-4 block"></i>
                    ${escapeHtml(message)}
                </div>
            `;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDuration(seconds) {
            if (!seconds) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Initial message
        resultsDiv.innerHTML = `
            <div class="col-span-full text-center text-gray-500 py-10">
                <i class="fas fa-search text-4xl mb-4 block"></i>
                Search for your favorite music
            </div>
        `;
    </script>
</body>
  </html>
